<!doctype html><html lang="en" data-cv-social="meeting-qa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting planner checks</title><link rel="stylesheet" href="/worker/design-system/glass.css"><link rel="stylesheet" href="/worker/experience-v3/experience-v3.css"><link rel="stylesheet" href="/worker/experience-v3/goal-planner.css"><style>body{font-family:Arial,sans-serif;margin:0;padding:16px}main{max-width:1160px;margin:auto}#cv-ws-search{width:100%;box-sizing:border-box}#results{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}dialog{max-width:calc(100vw - 64px)}dialog form{display:grid;gap:10px}</style></head><body><main id="cv-ws-app"><label>What do you have in mind?<input id="cv-ws-search"></label><button data-ws-ai-search>Ask Communiverse</button><button data-ws-meeting-new>Schedule a meeting</button><p id="cv-ws-status"></p><div id="cv-ws-search-results" hidden></div><pre id="results">Running…</pre></main><dialog id="cv-ws-dialog"></dialog><script>
window.MQA={calls:[],legacy:0};window.fetch=async(url,options={})=>{MQA.calls.push({url,method:options.method||'GET'});return new Response(JSON.stringify({person:{id:'demo-me',name:'You',role:'ambassador-lead'},team:[{id:'demo-me',name:'You',role:'ambassador-lead'},{id:'demo-ambassador',name:'Ambassador',role:'ambassador'}],tasks:[],projects:[]}),{headers:{'Content-Type':'application/json'}})};
document.querySelector('[data-ws-ai-search]').addEventListener('click',()=>MQA.legacy++);
document.querySelector('[data-ws-meeting-new]').addEventListener('click',()=>{const d=document.querySelector('dialog');d.innerHTML='<form data-ws-enhanced="meeting"><label>Meeting title<input name="title" required></label><label>Person<input type="checkbox" name="participants" value="demo-ambassador"></label><label>Starts<input name="start_at" type="datetime-local" required></label><label>Ends<input name="end_at" type="datetime-local" required></label><label>Time zone<input name="timezone" value="Asia/Dubai"></label><label>Where?<input name="location"></label><label>Agenda<textarea name="note"></textarea></label><button>Schedule and send invitations</button></form>';d.showModal();});
</script><script src="/worker/experience-v3/goal-planner.js"></script><script src="/worker/experience-v3/experience-v3.js"></script><script src="/worker/experience-v3/meeting-qa.js"></script></body></html>
