<!doctype html><html lang="en" data-cv-social="qa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmos planner behavioral QA</title><link rel="stylesheet" href="/communiverse/__cvux_v3.css"><style>body{margin:0;background:#f4f6f9;font:15px/1.5 Arial,sans-serif;color:#1c2636}*{box-sizing:border-box}header{padding:18px 5vw;background:white;display:flex;justify-content:space-between}main{max-width:1320px;margin:24px auto;padding:0 20px}#results{white-space:pre-wrap;padding:20px}#cv-ws-search{width:100%;padding:12px;border:1px solid #e0e5ee;border-radius:12px}.cv-profile-chip{display:grid;place-items:center;border-radius:50%;width:40px;height:40px;background:#e9eef6}</style></head><body><header><strong>Communiverse</strong><span class="cv-profile-chip">T</span></header><main><input id="cv-ws-search" aria-label="What do you have in mind?" value="I am looking for ambassadors"><div id="cv-ws-search-results"></div></main><pre id="results">Running checks…</pre>
<script>
window.qaDemo={person:{id:'test-lead',name:'Test Lead',role:'ambassador-lead'},team:[{id:'test-lead',name:'Test Lead',role:'ambassador-lead'},{id:'test-ops',name:'Test Operations',role:'operations'},{id:'test-ambassador',name:'Existing Ambassador',role:'ambassador'}],projects:[{id:'existing-project',title:'Existing programme',owner_id:'test-lead'}],tasks:[{id:'related-task',title:'Define the ambassador scorecard',description:'Recruitment criteria',status:'todo'}]};
window.qaCalls=[];window.qaRecords={projects:new Map(),tasks:new Map()};let failed=false;
const json=(x,status=200)=>Promise.resolve(new Response(JSON.stringify(x),{status,headers:{'Content-Type':'application/json'}}));
window.fetch=async(url,opts={})=>{const path=new URL(url,location.href).pathname;const data=opts.body?JSON.parse(opts.body):null;qaCalls.push({path,data});if(!data)return json({project:{owner_id:'test-lead'},members:['test-lead'],tasks:[]});const type=path.endsWith('/projects')?'projects':'tasks',map=qaRecords[type];if(!map.has(data.requestId))map.set(data.requestId,{id:crypto.randomUUID(),...data});if(type==='tasks'&&map.size===3&&!failed){failed=true;return json({error:'Simulated response lost after task creation'},503);}return json({ok:true,id:map.get(data.requestId).id},201);};
</script><script src="/communiverse/goal-planner.js"></script><script>
(async()=>{
const checks=[];const check=(name,pass)=>checks.push({name,pass:!!pass});const wait=async fn=>{for(let i=0;i<80;i++){if(fn())return;await new Promise(r=>setTimeout(r,20));}throw Error('Timed out waiting for test state');};
function ask(prompt){document.querySelector('#cv-ws-search').value=prompt;const a=document.createElement('section');a.className='cv-ws-assistant';a.innerHTML='<h2>Your next move</h2><p class="cv-assistant-answer">Review the relevant workspace context before recruiting.</p><form data-assistant-submit="original"><button type="submit">Submit request</button></form>';document.querySelector('#cv-ws-search-results').replaceChildren(a);window.__cvGoalPlanner.render(a,prompt,qaDemo);return a;}
function click(label){const b=[...document.querySelectorAll('.cvgp button')].find(b=>b.textContent===label);if(!b)throw Error('Missing '+label);b.click();}
try{
 for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k?.startsWith('cv-goal-plan:v1:test-lead:'))localStorage.removeItem(k);}
 let a=ask('i am lookig for more ambasadors');await wait(()=>document.querySelectorAll('.cvgp-step').length===7);
 check('Seven recruitment phases for the submitted typo',document.querySelectorAll('.cvgp-step').length===7&&document.querySelector('.cvgp h2').textContent==='Recruit ambassadors');
 check('No travel calculator or forced existing ambassador headcount',!document.querySelector('.cv3-plan-calc')&&!document.querySelector('.cv3-plan-travelers')&&!document.querySelector('.cvgp').textContent.includes('Daily allowance'));
 check('Unknown context is blank and optional costs are collapsed',[...document.querySelectorAll('.cvgp-side>.cvgp-field input')].every(i=>i.value==='')&&!document.querySelector('.cvgp-costs').open);
 check('Source submission is hidden and no work was created',getComputedStyle(a.querySelector('form')).display==='none'&&qaCalls.length===0);
 const detail=document.querySelectorAll('.cvgp-step')[1];detail.open=true;await wait(()=>!document.querySelectorAll('.cvgp-step')[0].open);check('One phase expanded at a time',document.querySelectorAll('.cvgp-step[open]').length===1);
 const region=document.querySelector('.cvgp-side>.cvgp-field input');region.value='Colombia';region.dispatchEvent(new Event('input',{bubbles:true}));click('Save draft');a=ask('i am lookig for more ambasadors');check('Draft restores context and seven phases',document.querySelector('.cvgp-side>.cvgp-field input').value==='Colombia'&&document.querySelectorAll('.cvgp-step').length===7);
 const before=document.querySelectorAll('.cvgp-step').length;click('Add a phase');check('A phase can be added',document.querySelectorAll('.cvgp-step').length===before+1);document.querySelectorAll('.cvgp-phase-actions .cvgp-icon')[7].click();check('Deleting a draft phase restores the count',document.querySelectorAll('.cvgp-step').length===7);
 click('Review plan');check('Review opens without creating anything',!document.querySelector('.cvgp-review').hidden&&qaCalls.length===0);click('Create 7 tasks');check('Missing owners block writes',document.querySelector('.cvgp-status').textContent.includes('Choose an owner')&&qaCalls.length===0);
 click('Assign unassigned phases to me');check('Explicit owner assignment covers every phase',[...document.querySelectorAll('.cvgp-review select[aria-label^="Owner"]')].every(s=>s.value==='test-lead'));
 click('Create 7 tasks');await wait(()=>document.querySelector('.cvgp-status').textContent.includes('Simulated response lost'));check('Interrupted creation keeps its recovery state',document.querySelector('.cvgp-actions').textContent.includes('Resume creating tasks')&&qaRecords.projects.size===1&&qaRecords.tasks.size===3);
 check('Partial creation cannot be edited into a different request',[...document.querySelectorAll('.cvgp-review select')].every(s=>s.disabled)&&document.querySelector('.cvgp-back').disabled);
 click('Resume creating tasks');await wait(()=>document.querySelector('.cvgp-status').textContent.includes('7 tasks created'));check('Retry completes seven unique tasks in one project',qaRecords.projects.size===1&&qaRecords.tasks.size===7);
 check('Server request keys survive the lost-response retry',qaCalls.filter(c=>c.path.endsWith('/tasks')&&c.data).length===8);
 check('Approval and initial states remain enforced',[...qaRecords.tasks.values()].every(t=>t.status==='todo')&&[...qaRecords.tasks.values()].find(t=>t.title==='Approve people and terms').approval_required===true);
 check('Task descriptions carry actions, output and confirmed context',[...qaRecords.tasks.values()][0].description.includes('Region: Colombia')&&[...qaRecords.tasks.values()][0].description.includes('Output: Recruitment brief'));
 const writes=qaCalls.length;a=ask('i am lookig for more ambasadors');check('Reopening a created draft offers the project, not duplicate creation',document.querySelector('.cvgp-actions a')?.textContent==='Open project'&&qaCalls.length===writes);
 a=ask('Organize a workshop');check('A different goal gets an event plan',document.querySelector('.cvgp h2').textContent==='Plan the event'&&!document.querySelector('.cv3-plan-calc'));
 check('X and trash are icon-only with accessible names',[...document.querySelectorAll('.cvgp-icon')].every(b=>!b.textContent.trim()&&b.getAttribute('aria-label')&&b.querySelector('svg')));
 check('Action buttons keep the shared pill radius',getComputedStyle(document.querySelector('.cvgp-action')).borderRadius==='999px');
 check('No horizontal overflow',document.documentElement.scrollWidth<=innerWidth+1);
 if(new URL(location.href).searchParams.has('preview'))ask('I am looking for ambassadors');
}catch(e){check('Unhandled exception: '+e.message,false);}
document.querySelector('#results').textContent=JSON.stringify({passed:checks.every(c=>c.pass),checks},null,2);
})();
</script></body></html>
