<!doctype html><html lang="en" data-cv-social="qa" data-cv-design="20261007-plug-team-2"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Communiverse circular control QA</title><link rel="stylesheet" href="/glass.css"><link rel="stylesheet" href="/worker/search-v4/search.css"><style>body{font:15px Arial;margin:0;padding:16px}.filters{display:flex;gap:4px}#results{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><div class="cv-plug"><div class="filters" role="toolbar" aria-label="Filter people"><button data-filter="communiverse" aria-pressed="true">Communiverse</button><button data-filter="cool-kids" aria-pressed="false">Cool Kids</button><button data-filter="ambassadors" aria-pressed="false">Ambassadors</button></div></div><div class="filters" role="group" aria-label="Independent filters"><button data-filter="one" aria-pressed="true">One</button><button data-filter="two" aria-pressed="true">Two</button></div><nav class="cv-ws-tabs"><button data-ws-tab="overview" aria-pressed="true">Focus</button></nav><nav class="cv-feed-tabs" aria-label="Feed view"><button data-view="all" aria-pressed="true">For you</button></nav><div role="radiogroup" aria-label="Request kind"><button class="cv3-kind-tile" role="radio" aria-checked="true">Event</button><button class="cv3-kind-tile" role="radio" aria-checked="false">Recruitment</button></div><label><input type="checkbox" name="people" value="one">One person</label><label><input type="checkbox" name="people" value="two">Another person</label><main id="main"><label class="cv4-search-field"><div class="cv4-search-inner"><input type="search" aria-label="Search"><button class="cv-ai-search-button cv4-ai-button"><span>AI</span></button></div></label></main><input type="checkbox" hidden aria-label="Hidden selection"><button data-cv-ui-icon="close" hidden aria-label="Hidden close">X</button><pre id="results"></pre><script src="/glass.js"></script><script>
document.querySelectorAll('.cv-plug .filters button').forEach(b=>b.addEventListener('click',()=>document.querySelectorAll('.cv-plug .filters button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))));
document.querySelectorAll('[aria-label="Request kind"] button').forEach(b=>b.addEventListener('click',()=>document.querySelectorAll('[aria-label="Request kind"] button').forEach(x=>x.setAttribute('aria-checked',String(x===b)))));
document.addEventListener('DOMContentLoaded',()=>requestAnimationFrame(()=>{const checks=[],check=(name,pass)=>checks.push({name,pass:!!pass});document.querySelector('[data-filter="cool-kids"]').click();
check('Legacy Plug marker is preserved and does not block shared controls',document.documentElement.dataset.cvDesign==='20261007-plug-team-2'&&document.documentElement.dataset.cvGlassDesign==='20261011-glass');
check('Plug filters keep toolbar and normal button semantics',document.querySelector('.cv-plug .filters').getAttribute('role')==='toolbar'&&[...document.querySelectorAll('.cv-plug .filters button')].every(b=>!b.hasAttribute('role')&&!b.hasAttribute('aria-checked')));
check('All navigation stays free of selection dots and radio semantics',[...document.querySelectorAll('.cv-ws-tabs,.cv-feed-tabs,.filters')].every(g=>g.getAttribute('role')!=='radiogroup'&&!g.querySelector('.cv-selection-dot,[role=radio]')));
check('Navigation stays keyboard focusable',[...document.querySelectorAll('.cv-ws-tabs button,.cv-feed-tabs button,.cv-plug .filters button')].every(b=>b.tabIndex===0));
const choice=document.querySelector('[aria-label="Request kind"] button');choice.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));check('Real radio choices keep dots and arrow keyboard behavior',document.querySelectorAll('[aria-label="Request kind"] .cv-selection-dot').length===2&&document.querySelectorAll('[aria-label="Request kind"] button')[1].getAttribute('aria-checked')==='true');
check('Click changes the existing filter',document.querySelector('[data-filter="cool-kids"]').getAttribute('aria-pressed')==='true');
check('Independent filters keep several selections',document.querySelector('[aria-label="Independent filters"]').getAttribute('role')==='group'&&document.querySelector('[data-filter="one"]').getAttribute('aria-pressed')==='true'&&document.querySelector('[data-filter="two"]').getAttribute('aria-pressed')==='true');
const inputs=[...document.querySelectorAll('input[type=checkbox]')];inputs.forEach(i=>i.checked=true);check('Native independent selections stay round and multiple',inputs.every(i=>i.checked&&i.type==='checkbox'&&getComputedStyle(i).borderRadius==='50%'));
check('Search has one shared border',parseFloat(getComputedStyle(document.querySelector('.cv4-search-inner')).borderTopWidth)>0&&getComputedStyle(document.querySelector('input[type=search]')).borderTopWidth==='0px');
const ai=document.querySelector('.cv4-ai-button');check('AI keeps the same label size and target as other actions',getComputedStyle(ai).fontSize==='14px'&&ai.getBoundingClientRect().height>=43.9);
document.querySelector('input[type=search]').focus();check('Keyboard focus stays visible on the search surface',getComputedStyle(document.querySelector('.cv4-search-inner')).outlineStyle==='solid'&&parseFloat(getComputedStyle(document.querySelector('.cv4-search-inner')).outlineWidth)>0);
check('Hidden controls stay hidden',[...document.querySelectorAll('[hidden]')].every(e=>getComputedStyle(e).display==='none'));
document.querySelector('#results').textContent=JSON.stringify({passed:checks.every(c=>c.pass),checks},null,2);}));
</script></body></html>
