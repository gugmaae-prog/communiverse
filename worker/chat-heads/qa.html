<!doctype html><html lang="en" data-cv-social="chat-qa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Communiverse chat head QA</title><link rel="stylesheet" href="/worker/design-system/glass.css"><link rel="stylesheet" href="/worker/chat-heads/style.css"><style>body{font-family:Arial,sans-serif;padding:24px;margin:0}#results{font-size:12px;max-width:650px;white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:24px}.demo-label{color:#55647a}</style></head><body><h1>Communiverse</h1><p class="demo-label">Chat interaction fixture · synthetic conversations only</p><pre id="results">Running…</pre><script>
const clone=x=>JSON.parse(JSON.stringify(x));
window.QA={requests:[],timers:[],lost:false,unauthorized:false,failDetail:false};
const originalInterval=window.setInterval;window.setInterval=(fn,ms)=>{if(ms===20000){QA.timers.push(fn);return 123}return originalInterval(fn,ms)};
const me={id:'demo-me',name:'You',profile_slug:''},ava={id:'demo-ava',name:'Ava',profile_slug:''},sam={id:'demo-sam',name:'Sam',profile_slug:''};
const store={threads:[{id:'thread-a',title:'Studio conversation',participants:[me,ava],last_message:'Ready for tomorrow?',unread:2},{id:'thread-b',title:'Community plans',participants:[me,sam],last_message:'Let’s work through the plan.',unread:0}],messages:{'thread-a':[{id:'m1',sender_id:'demo-ava',body:'Ready for tomorrow?',created_at:'2026-10-11 10:00:00'},{id:'m2',sender_id:'demo-me',body:'Yes, I have the brief ready.',created_at:'2026-10-11 10:01:00'},{id:'m3',sender_id:'demo-ava',body:'<img src=x onerror=alert(1)>\nThis stays plain text.',created_at:'2026-10-11 10:02:00'}],'thread-b':[]},files:{'thread-a':[{id:'file-1',name:'Studio brief.pdf',bytes:2048}],'thread-b':[]},keys:new Map()};
window.fetch=async(url,options={})=>{const u=new URL(url,location.origin),path=u.pathname.replace('/communiverse/api/',''),body=typeof options.body==='string'?JSON.parse(options.body):options.body;QA.requests.push({path,method:options.method||'GET',body,credentials:options.credentials});const response=(data,status=200)=>new Response(JSON.stringify(data),{status,headers:{'Content-Type':'application/json'}});if(QA.unauthorized)return response({error:'Sign in again.'},401);if(path==='identity/me')return response({person:me});if(path==='workspace/connect/directory')return response({people:[me,ava,sam]});if(path==='workspace/connect/threads'&&!options.method){const id=u.searchParams.get('id');if(QA.failDetail&&id)return response({error:'Temporary issue'},503);return response(id?{thread:store.threads.find(t=>t.id===id),participants:store.threads.find(t=>t.id===id).participants,messages:store.messages[id],files:store.files[id]}:{threads:store.threads})}if(path==='workspace/connect/threads/read'){store.threads.find(t=>t.id===body.id).unread=0;return response({ok:true})}if(path==='workspace/connect/messages'){let id=store.keys.get(body.requestId);if(!id){id='sent-'+store.keys.size;store.keys.set(body.requestId,id);store.messages[body.thread_id].push({id,sender_id:me.id,body:body.body,reply_to:body.reply_to,created_at:'2026-10-11 10:05:00'});store.threads.find(t=>t.id===body.thread_id).last_message=body.body}if(QA.lost){QA.lost=false;throw Error('Connection interrupted')}return response({ok:true,id})}if(path==='workspace/connect/threads'&&options.method==='POST'){const id='thread-new';store.threads.push({id,title:body.title,participants:[me,...[ava,sam].filter(p=>body.participants.includes(p.id))],last_message:body.body,unread:0});store.messages[id]=[{id:'new-first',sender_id:me.id,body:body.body,created_at:'2026-10-11 10:10:00'}];store.files[id]=[];return response({ok:true,id},201)}if(path==='workspace/connect/files'){store.files[u.searchParams.get('target')].push({id:'file-new',name:u.searchParams.get('name'),bytes:options.body.size});return response({ok:true,id:'file-new'},201)}return response({error:'Unsupported fixture request'},404)};
</script><script src="/worker/chat-heads/client.js"></script><script src="/worker/chat-heads/qa.js"></script></body></html>
