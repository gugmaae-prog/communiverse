name: Communiverse Search v4 Staging Checks
on:
  push:
    branches: [feature/communiverse-search-unified-20261010]
    paths:
      - 'worker/search-v4/**'
      - '.github/workflows/communiverse-search-v4.yml'
  pull_request:
    paths:
      - 'worker/search-v4/**'
      - '.github/workflows/communiverse-search-v4.yml'
permissions:
  contents: read
jobs:
  search-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check staging and browser code syntax
        run: |
          node --check worker/search-v4/search.js
          node --check worker/search-v4/staging-gateway.mjs
          node --check worker/search-v4/production-gateway.mjs
          node --check worker/search-v4/qa-runner.js
          node --check worker/search-v4/qa-plug.js
          node --check worker/search-v4/plug-clearance.js
      - name: Assert same input and AI button are retained
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const js=fs.readFileSync("worker/search-v4/search.js","utf8");
          const css=fs.readFileSync("worker/search-v4/search.css","utf8");
          const gateway=fs.readFileSync("worker/search-v4/staging-gateway.mjs","utf8");
          const prod=fs.readFileSync("worker/search-v4/production-gateway.mjs","utf8");
          const clearance=fs.readFileSync("worker/search-v4/plug-clearance.js","utf8");
          assert.ok(js.includes("line.append(button)"));
          assert.ok(js.includes("line.append(icon(),input)"));
          assert.ok(js.includes("aiButtonsMoved"));
          assert.ok(css.includes(".cv4-search-inner"));
          assert.ok(css.includes(".cv4-ai-button[hidden]"));
          assert.ok(gateway.includes("Read-only staging"));
          assert.ok(!gateway.includes("COMMUNIVERSE_DB"));
          assert.ok(css.includes("Plug story-card overflow correction"));
          assert.ok(css.includes("cv4-story-clearance"));
          assert.ok(clearance.includes("querySelectorAll"));
          assert.ok(gateway.includes("new Body(u.searchParams.get"));
          assert.ok(gateway.includes("PLUG_FIX_JS"));
          assert.ok(prod.includes("PLUG_CLEARANCE"));
          assert.ok(prod.includes("runtime.fetch(new Request(url,request))"));
          assert.ok(!prod.includes("Read-only staging"));
          assert.ok(!prod.includes("qa.txt"));
          assert.ok(!prod.includes("COMMUNIVERSE_DB"));
          assert.ok(prod.includes("PUBLIC_PAGES.has(path)"));
          '
