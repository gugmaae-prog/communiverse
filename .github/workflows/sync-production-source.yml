name: Sync exact Communiverse production source
on:
  push:
    branches: [codex/production-sync-20261007]
    paths: [scripts/snapshot-production.py, .github/workflows/sync-production-source.yml, .github/production-sync-request.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: communiverse-production-source-sync
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read pinned Cloudflare modules and verify exact source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/snapshot-production.py capture
      - name: Commit verified snapshot to the same branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- production
          if ! git diff --cached --quiet; then
            git commit -m 'Snapshot exact Communiverse shared-UI Worker modules and binary assets'
            git push origin "HEAD:refs/heads/$REF_NAME"
          fi
          printf '## Production source sync\n125 checksummed modules; no Cloudflare writes or database exports.\n\nCommit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
