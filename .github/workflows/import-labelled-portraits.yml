name: Import labelled portrait assets
on:
  push:
    branches: [codex/labelled-portraits-20261006]
    paths: [.github/workflows/import-labelled-portraits.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/labelled-portraits-20261006
      - name: Validate and import the ten approved portraits
        env:
          PORTRAIT_SOURCE: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-7dfc-8211-af40-247a9033bcda/raw?se=2026-10-06T13%3A06%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=d0a55524-67f7-5ea6-a1a9-7a397fce8cd7&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T04%3A44%3A43Z&ske=2026-10-07T04%3A44%3A43Z&sks=b&skv=2026-02-06&sig=1grk8bnxT3FE0/8Mf4HUGpT2VOHatshXiH331vc5EGI%3D'
        run: |
          python3 - <<'PY'
          import os, urllib.request, hashlib, zipfile, io, json, pathlib, re
          url=os.environ['PORTRAIT_SOURCE']
          print('::add-mask::'+url)
          raw=urllib.request.urlopen(url,timeout=45).read(2000000)
          assert hashlib.sha256(raw).hexdigest()=='63a9bf74cabd4936618c62ad3d421b6a19436e74cb0aab6fdd032d13acd0bffa', 'Bundle checksum mismatch'
          z=zipfile.ZipFile(io.BytesIO(raw)); people=json.loads(z.read('people.json'))
          assert len(people)==10
          target=pathlib.Path('public/communiverse-people/20261006'); target.mkdir(parents=True,exist_ok=True)
          public=[]
          for p in people:
              assert re.fullmatch(r'[a-z][a-z0-9-]+',p['id'])
              assert p['group'] in ['team','ambassadors']
              data=z.read('people/'+p['webFilename'])
              assert hashlib.sha256(data).hexdigest()==p['webSha256']
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              (target/p['webFilename']).write_bytes(data)
              public.append({k:p[k] for k in ['id','name','role','group','webFilename','width','height','webBytes','webSha256']})
          pathlib.Path('worker/people-portraits.json').write_text(json.dumps(public,ensure_ascii=False,indent=2)+'\n')
          print('Imported 10 lossless portrait crops; no deck pages, financial details, or private contacts uploaded.')
          PY
      - name: Commit only portrait assets and public labels
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/communiverse-people/20261006 worker/people-portraits.json
          git rm .github/workflows/import-labelled-portraits.yml
          git commit -m 'Add ten labelled Communiverse portraits, preserving source pixels'
          git push origin HEAD:codex/labelled-portraits-20261006
