name: Verify Communiverse production release
# This replaces the unsafe legacy static-export deployment; no Cloudflare writes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - worker/releases/shared-plug-ui-20261007/**
      - deployments/20261007-shared-plug-ui-1.json
      - scripts/verify-live-release.mjs
      - .github/workflows/deploy.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public release and source checksums
        run: node scripts/verify-live-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: communiverse-live-release-verification
          path: verification-results.json
          if-no-files-found: warn
          retention-days: 30
