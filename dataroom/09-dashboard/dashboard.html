een budget and mid-range daily food (groceries + cheap restaurants)."], ["Local transport tier weight (0 = budget, 1 = mid-range)", "1", "Mid-range local transport assumed because field work (artisan visits, filming kit) means more taxis/ride-hailing than a backpacker."], ["Hotel comfort uplift on modest-tier rates", "0", "0% = budget-hotel/guesthouse averages. Raise to model slightly nicer rooms."], ["Season used on Incentives / Comparison summary", "Shoulder", "Low, Shoulder or High. All three seasons are always shown on PackageModel."], ["Kit contingency %", "0.1", "Applied inside the equipment Kit sheet."], ["Key modelling assumptions", "", ""], ["1. Sponsored travellers: only Luna receives a paid fee (input B15, blank). All other ambassadors (UAE, India, Egypt, any other) are sponsored travellers whose travel is covered by this budget; fee = 0.", "", ""], ["2. Per-artisan incentive (B11) is paid on top of the travel package for every region (UAE, Colombia, India, Egypt).", "", ""], ["3. Flights are economy, round trip (international) or one way (domestic legs). Season values come from published fare data where available; shoulder is the midpoint of low and high where no direct source exists (orange cells, 'Estimate').", "", ""], ["4. Hotels = 'modest tier': budget-hotel / guesthouse averages (Kayak-based averages via BudgetYourTrip) or local 'budget hotel' ranges. They are per ROOM per night, 1 traveller, before taxes/fees (Dubai Tourism Dirham AED 7-20/room/night is NOT included).", "", ""], ["5. Hotel nights = trip days - 1, times the 'share of nights needing paid accommodation' (Packages!O). UAE domestic uses 50% because the Dubai-based ambassador can sleep at home on some days - change to 100% for a non-Dubai ambassador.", "", ""], ["6. Local transport and food per day come from BudgetYourTrip traveller-reported averages (Daily_Costs sheet) blended by the tier weights above. Seasonal multipliers for these two lines default to 1.00 (no published seasonal data) and can be edited on Seasonal.", "", ""], ["7. International packages = round-trip Dubai flight + an in-country plan (Colombia Bogota/Medellin/Raquira, India Delhi/Jaipur, Egypt Cairo/Luxor) similar to the matching domestic package; leg counts are separate inputs on Packages. Dubai-Mumbai package assumes flying Mumbai-Delhi and back (2 extra domestic legs).", "", ""], ["8. Equipment kit (DJI Osmo Nano + tripod + memory card + contingency) is carried into every package. 'Kit allocation per trip' (Packages!Q) is 100% by default = conservative (kit charged fully to each trip). Set e.g. 50% if a kit is reused across trips.", "", ""], ["9. Not included: visas, travel insurance, vaccinations, SIM/data, activities/entry fees, checked-bag fees, airport transfers beyond local transport, tips, artisan samples/shipping, any ambassador fee. See Open_Questions.", "", ""], ["10. Meta glasses are excluded from the standard kit (restricted in some countries); only a possible future sponsored item and not in any total.", "", ""]]}, {"h": "Sheet: Flights"}, {"t": [["Sample fares by route and season (economy). Local-currency inputs -> USD and AED by formula.", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], ["RT = round trip, OW = one way. Orange = estimate/derived (shoulder = midpoint of low/high unless a source states otherwise). Fares are public 'typical/from' prices seen on aggregators, NOT quotes - confirm at booking.", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], ["ID", "Region", "Route", "Segment", "Fare type", "Currency", "Low (local)", "Shoulder (local)", "High (local)", "USD Low", "USD Shoulder", "USD High", "AED Low", "AED Shoulder", "AED High", "Basis", "How season was mapped / notes", "Source IDs", "Reliability"], ["DXB-BOG", "Colombia", "Dubai - Bogota (1-stop via Europe/Turkey/Gulf)", "International", "RT", "USD", "1,370", "1,586", "2,135", "1370", "1586", "2135", "5,031.32", "5,824.59", "7,840.79", "Published", "Kayak 12-month data: Sep = cheapest month avg RT $1,370 (Low); 12-month average RT $1,586 (Shoulder); Jul = most expensive month $2,135 (High). Cheapflights: avg $1,519, Jul $2,129. Google Flights (cached, older): cheapest Feb, dearest Dec. Kayak.ae (AED) instead shows Jan cheapest, Nov/Jul dearest - aggregators disagree on month.", "S1,S2,S3", "Medium"], ["DXB-MDE", "Colombia", "Dubai - Medellin (1-stop; no nonstop)", "International", "RT", "USD", "912.71", "1,256.98", "1,692.09", "912.71", "1,256.98", "1,692.09", "3,351.93", "4,616.26", "6,214.19", "Estimate / derived", "Low = avg of Kissandfly lowest monthly 'from' fares Feb/Mar/Apr; Shoulder = avg of Jul/Aug/Sep/Nov 'from' fares; High = ESTIMATE: shoulder scaled by the Dubai-Bogota High/Shoulder ratio (no source gives a Medellin peak fare). Kissandfly 'from' fares are minimums for a month, so typical fares are probably higher; trip type not stated by site (assumed RT). Other 'from' points: Expedia UK RT from GBP1,310; Skyscanner CA RT best C$1,964.", "S4,S5", "Low"], ["DXB-DEL", "India", "Dubai - Delhi (nonstop ~3h50, many carriers)", "International", "RT", "USD", "222.5", "292.5", "362.5", "222.5", "292.5", "362.5", "817.13", "1,074.21", "1,331.28", "Estimate / derived", "Google Flights typical cheapest 1-week RT: Sep $200-245 (cheapest month) and Dec $310-415 (dearest); midpoints used. Shoulder = estimate. Cross-check DXB-DEL-OW row: Air India Express one-way from AED394 (Sep/Oct), AED580 (Nov), AED804 (Dec) - same pattern. Diwali (Nov 2026) and winter wedding/holiday season push fares up.", "S6,S7,S8", "Medium"], ["DXB-BOM", "India", "Dubai - Mumbai (nonstop ~3h)", "International", "RT", "USD", "235", "344.5", "454", "235", "344.5", "454", "863.04", "1,265.18", "1,667.32", "Estimate / derived", "Trip.com: Sep avg RT ~$235 (cheapest); Aug up to ~$454 (Gulf summer-holiday travel to India). Shoulder = estimate (midpoint). Cheapflights listing: IndiGo from AED397.", "S9", "Medium"], ["DXB-CAI", "Egypt", "Dubai - Cairo (nonstop ~3h40, daily)", "International", "RT", "USD", "374", "472", "570", "374", "472", "570", "1,373.52", "1,733.42", "2,093.32", "Estimate / derived", "Kayak 12-month: Oct cheapest avg RT $374 (Low); May dearest $570, Mar $509 (High). Google Flights: Oct $220-245 cheapest-fare view, Jun dearest $310-430. Momondo: Sep $366, Oct $376. Note: for Dubai-origin travel, fare seasonality follows Gulf holiday periods, not Egypt's own winter peak.", "S10,S11,S12,S13", "Medium"], ["DXB-DEL-OW", "India", "Dubai - Delhi one-way cross-check (Air India Express 'from')", "International", "OW", "AED", "394", "580", "804", "107.28", "157.93", "218.92", "394", "580", "804", "Published", "Cross-check only (not used in packages). Sep/Oct = AED394, Nov = AED580, Dec = AED804.", "S7", "Medium"], ["BOG-MDE", "Colombia", "Bogota - Medellin domestic (JetSMART/Avianca/LATAM, ~1h)", "Domestic", "OW", "USD", "53", "80", "110", "53", "80", "110", "194.64", "293.8", "403.98", "Published", "Low = Avianca 'from' USD53; Shoulder = LATAM 'from' USD80 (Expedia); High = top of USD50-110 typical one-way (Latam Travellers, Jun 2026). JetSMART floor COP78,630 (~USD23) excl. bags. Jul and Dec-Jan are peak.", "S14,S15,S16,S17", "Medium"], ["COL-BUS", "Colombia", "Bogota - Raquira bus (craft town, ~3h)", "Ground", "OW", "COP", "39,000", "46500", "54,000", "11.64", "13.88", "16.12", "42.76", "50.98", "59.21", "Estimate / derived", "Range of published bus fares COP39,000-54,000 (Libertadores/Coflonorte) used as low-high proxy; no seasonal fare source. Medellin-Bogota bus is COP80,000-100,000 (8-10h) - reference only.", "S18", "Medium"], ["DEL-JAI-TR", "India", "Delhi - Jaipur train (~4.5-5.5h)", "Ground", "OW", "INR", "500", "900", "1,600", "5.21", "9.38", "16.67", "19.13", "34.44", "61.23", "Estimate / derived", "Class-based proxy, not seasonal: Low = Chair Car min INR500 (ixigo); Shoulder = 2AC INR900 (Globalsblog); High = Vande Bharat/Shatabdi upper INR1,600 (HappyFares). Sleeper from INR220. Book ro/bus AED3-7.50 per trip, Silver NOL daily cap AED14.", "S27", "High"], ["How season affects fares", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], ["Colombia (from Dubai): Dec-Jan and Jun-Aug are high (Jul worst on Kayak/Cheapflights); Feb, Mar and Sep are cheapest. Domestic Colombian flights/buses also spike in Dec-Jan, Semana Santa (Mar/Apr) and Jul school holidays.", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], ["India (from Dubai): Sep-Oct cheapest; Nov (Diwali, Nov 2026), Dec and winter wedding/holiday season dearest; Aug and Apr-Jun can be dear for Gulf-India summer-holiday travel. Domestic fares jump for last-minute booking (50-100%).", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], ["Egypt: destination peak is Oct-Apr (hotels, Nile trains, domestic flights), summer (Jun-Aug) is hot/low season. From Dubai the cheapest flight months on aggregators are Sep-Oct and the dearest are Mar/May/Jun, so flight and hotel seasons do not line up - see Seasonal sheet.", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], ["UAE: no domestic flights; ground transport only. Summer (Jun-Sep) is low season for hotels (40-70% below winter peak Nov-Mar); bus/metro fares are flat.", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""]]}, {"h": "Sheet: Hotels"}, {"t": [["Modest-tier accommodation per room per night (budget hotel / guesthouse / private room), low vs high season", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], ["Mostly Kayak-based averages published by BudgetYourTrip (Jul-Aug 2026 'last updated'); 'low' = low-season average, 'high' = peak-season average. Rates exclude taxes/fees. Shoulder = midpoint (estimate). Hostel dorms are cheaper but shared - not used for sponsored travellers' private rooms.", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""], ["ID", "Region", "City", "Tier / type", "Currency", "Low se  (pottery/craft town)", "Hostel DORM bed (private room not sourced)", "USD", "8", "15", "11.5", "8", "11.5", "15", "29.38", "42.23", "55.09", "", "Estimate / derived", "[S40] takeyourbackpack 2026: dorms $8-15, meals $3-6, total $15-30/day. Range used as low-high proxy; dorm only, so private rooms are likely dearer. Not used in package averages.", "Low"], ["PPN", "Colombia", "Popayan (white city, craft region)", "Private room / budget hotel", "USD", "15", "30", "22.5", "15", "22.5", "30", "55.09", "82.63", "110.17", "", "Estimate / derived", "[S40] theworldtravelindex 2026: budget rooms $8-20, private rooms $15-30, hotel avg $40-50. Range used as low-high proxy. Reference only.", "Low"], ["CTG", "Colombia", "Cartagena (reference only)", "Hostel bed", "USD", "18", "35", "26.5", "18", "26.5", "35", "66.11", "97.32", "128.54", "", "Estimate / derived", "[S41] Latam Travellers/Malokal 2026: hostel beds $18-35; Getsemani mid-range $70-130; Walled City $140-320 (high season Dec-Mar +40-70% vs Sep-Nov). Cartagena costs ~1.4-1.6x Bogota/Medellin. Not used in packages.", "Low"], ["DEL", "India", "Delhi", "Budget hotel / guesthouse private room", "INR", "1350", "2,500", "1925", "14.07", "20.06", "26.05", "51.66", "73.66", "95.67", "", "Estimate / derived", "[S42,S35] Multi-source 2026 guides: private rooms INR700-2,000; peak (Oct-Mar) budget rooms in tourist areas INR2,500-4,000 (lower bound used). BYT national India hotel avg $29 low / $54 peak. BYT Delhi page unreliable (data error) so not used.", "Low"], ["JAI", "India", "Jaipur (block-print/craft city)", "Budget hotel / guesthouse", "INR", "1350", "2350", "1850", "14.07", "19.28", "24.49", "51.66", "70.79", "89.93", "", "Estimate / derived", "[S42] Jaipur guides 2026: peak Oct-Mar budget hotels INR1,200-3,500; summer low (Apr-Jun) INR700-2,000; hostel dorms INR400-900. Midpoints used.", "Low"], ["CAI", "Egypt", "Cairo", "Budget hotel", "USD", "22", "42", "32", "22", "32", "42", "80.8", "117.52", "154.25", "", "Published", e) / 128GB (107.6GB usable) internal; no direct microSD recording; recommended microSD cards", "Snippet"], ["S50", "dolar-colombia.com", "https://www.dolar-colombia.com/en/2026-09-29", "COP 3,349.63 per USD (29 Sep 2026)", "Snippet"], ["S51", "The Hindu / HDFC Sky - INR", "https://www.thehindu.com/business/markets/rupee-trades-in-narrow-range-against-us-dollar-in-early-trade/article71531481.ece", "USD/INR ~95.97 on 1 Oct 2026 (intraday up to ~96.3)", "Snippet"], ["S52", "Techno Time / CBE - EGP", "https://www.technotime.net/17338", "CBE USD 51.91 buy / 52.05 sell on 1 Oct 2026", "Snippet"], ["S53", "Egypt cost guides (Hello Travel, Egypttrippers, Granada Travel, Hungarian Abroad)", "https://www.travelwithhello.com/blog/egypt-travel-budget-guide", "Egypt cross-checks: budget $30-60/day, hostel $8-15, mid-range hotels $50-120, taxis/Uber $1-6", "Snippet; cross-check only"], ["Reliability caveats", "", "", "", ""], ["Fares are aggregator 'from'/typical prices and 12-month averages; no live booked quotes were obtained. Seasonal splits for DXB-MDE (High), shoulder values and Indian/Egyptian hotel figures are estimates and are labelled in orange.", "", "", "", ""], ["Aggregators disagree on cheapest/dearest months for Dubai-Bogota (Kayak.com: Sep cheapest/Jul dearest; Kayak.ae: Jan cheapest/Nov & Jul dearest; Google: Feb/Dec).", "", "", "", ""], ["BudgetYourTrip hotel averages are Kayak-derived 'budget' categories and can include apartments and hostels; the Delhi page returned unrelated data (not used). Indian hotel inputs come from blog guides and are low confidence.", "", "", "", ""], ["Exchange rates move daily (INR is near record lows; COP moved 3,067-3,380 within Sep 2026). Update Assumptions B6:B9 and re-check key fares before committing a budget.", "", "", "", ""], ["Consumer electronics prices vary by retailer and day (e.g., 256GB microSD $24.99 at B&H vs $66.60 on Amazon.com).", "", "", "", ""]]}, {"h": "Sheet: Open_Questions"}, {"t": [["Open questions for Keiffer and Haseeb", "", "", ""], ["#", "Question", "Why it matters / model impact", "For"], ["1", "Standard trip length: is 7 days the default and 14 days an option, or should some regions run longer?", "Drives hotel nights, food, transport (Assumptions B16/B17).", "Keiffer"], ["2", "Who books and pays: Communiverse books flights/hotels directly, or ambassadors book and claim expenses (per-diem vs receipts)?", "Controls leakage and whether to model a fixed per-diem instead of actuals.", "Keiffer / Haseeb"], ["3", "Is there a hard cap per trip (USD) and per ambassador per month/quarter? Should it include the artisan incentive?", "The model shows totals by region so a cap can be set against Comparison.", "Haseeb"], ["4", "Luna's fee: is it monthly or per trip, and what is the amount? Is it paid for travel days only?", "Left blank on Assumptions B15 (not invented). If monthly, decide how much is allocated to each trip.", "Keiffer / Haseeb"], ["5", "Visa costs: Egypt e-visa/visa on arrival, India e-visa, Colombia (no visa for many passports) - which nationality does each ambassador hold? Who pays?", "Not in the totals; can be material for India/Egypt.", "Keiffer"], ["6", "Travel insurance (medical + equipment) - required? Provider and per-trip cost?", "Not in totals; also covers the Osmo Nano kit.", "Haseeb"], ["7", "Incentive rules: is USD150 per signed AND verified artisan final? Any monthly cap, minimum quality bar, or lower rate for repeat artisans? When is it paid (after verification)?", "Drives Incentives sheet; cost per signed artisan.", "Keiffer"], ["8", "What counts as 'domestic' for an ambassador based in Dubai - e.g., is Dubai-to-Abu Dhabi day travel covered, and may the ambassador sleep at home (Packages!S, UAE 50% assumption)?", "UAE hotel nights.", "Keiffer"], ["9", "Should international legs be economy only, and is a layover/long itinerary (via Europe/Turkey/Gulf, 19-27h) acceptable for a low-spend traveller? Direct options (e.g., via Istanbul) cost more.", "Flight line is the largest cost for Colombia.", "Keiffer"], ["10", "Equipment: is one kit per ambassador kept after the trip (full cost charged to first trip), or reused across trips (Packages!T allocation)?", "Kit is ~USD 490 (incl. 10% kit contingency) and is charged 100% to each trip by default.", "Haseeb"], ["11", "Camera rules by country: confirm the Osmo Nano (small wearable camera) can be used and carried in India, Egypt, Colombia and UAE without permits; Meta glasses excluded for now.", "Customs/permit risk; no cost included.", "Keiffer"], ["12", "Connectivity: eSIM/data (e.g., ~USD3 Colombia eSIM) and local SIM costs - should they be added?", "Small but needed for filming/uploads.", "Keiffer"], ["13", "Ground transport extras: airport transfers, private drivers for remote craft villages (Raquira, Fayoum, rural Rajasthan) - include a budget line?", "Currently only city transit/ride-hail and intercity buses/trains.", "Keiffer"], ["14", "Artisan-related costs: samples, shipping, photography fees, translation - covered elsewhere?", "Not in this model.", "Haseeb"], ["15", "Contingency: is 10% enough for India/Egypt where price volatility and negotiation are higher? Any FX buffer for INR/COP/EGP?", "Assumptions B10.", "Haseeb"], ["16", "Region sequencing and trip counts: how many trips per region per quarter (UAE and Colombia first)?", "Needed to turn per-trip costs into a programme budget.", "Keiffer"]]}], "size": 104626}, "d22": {"name": "Communiverse - Requirements & Equipment (final v6) - ops cost input.xlsx", "sec": "07 Financials & Capital", "ext": "xlsx", "blocks": [{"h": "Sheet: Ambassadors"}, {"t": [["Communiverse \u2013 Ambassador roster", "", "", "", "", "", "", "", "", "", "", ""], ["Updated 2026-10-05 (Ammar questionnaire complete). Planning kit count stays on Simple cost (B3). This tab is the people roster.", "", "", "", "", "", "", "", "", "", "", ""], ["Name", "Status", "Email", "Phone", "City / base", "Languages", "Own camera", "Driving licence", "Needs Communiverse kit?", "Questionnaire", "Brief", "Notes"], ["Luna", "Questionnaire returned (30 Sep 2026)", "", "", "Dubai / open worldwide", "Spanish, English, Portuguese", "Yes (camera, Meta glasses, iPhone)", "Unknown", "Yes \u2013 tripod + action camera", "Completed (local file)", "Prepared for Luna", "IG 6k+ followers; wants videography training from Keiffer."], ["Ammar Zaky", "Questionnaire returned (5 Oct 2026)", "[email redacted]", "[phone redacted]", "UAE \u2013 Dubai & Abu Dhabi (travel across UAE)", "Arabic (native), English (fluent)", "Yes \u2013 iPhone 17 Pro Max + wireless mic + basic lighting", "Yes \u2013 valid international driving licence", "Optional \u2013 Communiverse action camera for specific shoots only (no full Osmo kit assumed)", "Completed in Espacios chat 5 Oct 2026", "https://docs.google.com/document/d/1WZeKrXODFEY4Y6XnikN2MqsxjZszLNfnLs1mp-ckQJ8/edit", "IG 33k+ (strong engagement); also TikTok & YouTube. 2\u20133 days/week; 2\u20133 vlogs/stories per week. Network: lifestyle, food, fitness, handmade / local creatives & SMBs. WhatsApp + IG weekly with artisans. Wants: content guidelines, artisan coordination, equipment access, regular feedback; clear deliverables/timelines/workflow."], ["Kit cost note", "", "", "", "", "", "", "", "", "", "", ""], ["Ammar has iPhone 17 Pro Max, wireless mic and basic lighting; does not need a full DJI Osmo Nano kit. Offer Communiverse action camera only for specific shoots. Luna still needs tripod + action camera per her answers. Keep Simple cost B3 as planning headcount; adjust Equipment when kit buys are confirmed.", "", "", "", "", "", "", "", "", "", "", ""]]}, {"h": "Sheet: Ammar answers"}, {"t": [["#", "Question", "Answer (5 Oct 2026)"], ["1", "Which city/country will you represent, and which areas can you travel through?", "Based in the UAE; can represent Dubai and Abu Dhabi, with flexibility to travel across the UAE when needed."], ["2", "Which crafts and artisans do you already know? Who could you bring on in your first month?", "Connections with local creatives and small businesses across Dubai and the UAE, especially lifestyle, food, fitness and handmade products. Can reach out to relevant artisans and bring in a few strong profiles in the first month."], ["3", "Which communities, galleries, venues or institutions are you connected to?", "Connected with local creative and community groups in Dubai and the UAE, plus venues and small businesses through content and events work. Can leverage existing network to build new community and institution connections."], ["4", "Have you vlogged before? Share two or three examples of content you have made.", "Creates vlog-style and short-form content covering experiences, events, activities and local business. Examples: event coverage, food/lifestyle experiences, skating community content. Can share 2\u20133 Instagram examples on request."], ["5", "How confident are you with lighting, camera settings and effects, and directing people on camera? Where would you like training?", "Confident with lighting, camera settings, effects and directing people on camera, especially for short-form. Open to improving technical skills, particularly professional lighting and more advanced camera techniques."], ["6", "What filming equipment do you have now? Will you need a Communiverse action camera?", "iPhone 17 Pro Max, wireless microphone and basic lighting. Comfortable creating high-quality mobile content; happy to use a Communiverse action camera for specific shoots."], ["7", "Have you taught others to create content before? How would you help artisans film on their own?", "Has helped others create and improve social media content. Would keep it simple for artisans: easy filming setups, camera angles, lighting, and capturing their process naturally so they can create quality content independently."], ["8", "How will you keep in touch with the artisans you bring on, and how often?", "Regular contact through WhatsApp and Instagram, with follow-ups based on content needs. Aim for at least weekly communication with active artisans."], ["9", "Which social platforms do you use, and roughly how large and engaged is your audience?", "Main platform Instagram with 33k+ followers, strong engagement and regular reach. Also TikTok and YouTube for short-form with growing audiences."], ["10", "What languages do you work in?", "Arabic (native), English (fluent) \u2014 confirmed."], ["11", "How much time can you give each month, and how often can you travel?", "About 2\u20133 days per week, with flexibility depending on filming schedules. Based in UAE; can travel across the country for planned shoots and events."], ["12", "How often could you deliver vlogs and artisan stories?", "Around 2\u20133 vlogs or stories per week depending on filming schedule and locations; flexible to adjust to project needs."], ["13", "What support would help you most from Keiffer, Hassan or the operations team?", "Clear content guidelines, coordination with artisans, access to necessary equipment, and regular team feedback to stay aligned with project goals."], ["14", "Is anything in this brief unclear, or is there anything you would add?", "Brief is clear overall. Wants clear expectations on content deliverables, timelines and workflow from the start. Open to discussing additional ideas to make artisan stories more engaging."]]}, {"h": "Sheet: Simple cost"}, {"t": [["Communiverse \u2013 Ambassador equipment cost (all AED)", "", "", "", "", "", "", "", ""], ["Number of ambassadors (edit this)", "3", "<- single input: drives every cost here and on the Equipment and Kit tabs", "", "", "", "", "", ""], ["One-off kit cost (ambassadors x kit per ambassador)", "", "", "5,431.03", "", "", "", "", ""], ["Grand total (kit + storage + ChatGPT for the period)", "", "", "14,038.03", "", "", "", "", ""], ["Item", "Qty", "Unit AED", "Line AED", "", "", "", "", ""], ["DJI Osmo Nano Standard Combo 128GB", "1", "1,499", "1499", "", "", "", "", ""], ["Neewer TP35 flexible tripod + remote", "1", "54.99", "54.99", "", "", "", "", ""], ["256GB microSD (USD 24.99 \u00d7 FX rate)", "1", "91.78", "91.78", "", "", "", "", ""], ["Kit subtotal", "", "", "1,645.77", "", "", "", "", ""], ["Contingency (replacement / accessories / shipping)", "0.1", "", "164.58", "", "", "", "", ""], ["Kit total per ambassador", "", "", "1,810.34", "", "", "", "", ""], ["Kit total per ambassador (used below)", "", "", "1,810.34", "", "", "", "", ""], ["Assumptions", "", "", "", "", "", "", "", ""], ["Pricing source", "Prices from the Communiverse Ambassador Travel Package Model (Kit sheet), as seen 1 Oct 2026; retail prices change often.", "", "", "", "", "", "", ""], ["Kit policy", "One kit per ambassador; the kit is reused (not bought again per event).", "", "", "", "", "", "", ""], ["Scope", "Camera, tripod and memory card only. No audio, no lighting.", "", "", "", "", "", "", ""], ["Currency", "All figures in AED. The only USD price is the microSD card, converted at the FX rate below.", "", "", "", "", "", "", ""], ["Contingency %", "0.1", "", "", "", "", "", "", ""], ["FX rate (AED per 1 USD)", "3.67", "", "", "", "", "", "", ""], ["microSD price (USD)", "24.99", "", "", "", "", "", "", ""], ["Storage (approximate - pending approval)", "", "", "", "", "", "ChatGPT subscription (approximate - pending approval; only one subscription needed, per Keiffer)", "", ""], ["Sorage - approximate AED 350 per month", "350", "AED per month (editable)", "", "", "", "ChatGPT price (USD per month)", "100", "USD per month - approximate, given by Keiffer, to be confirmed"], ["Include storage? (approved)", "Yes", "Yes / No - set to No if not approved", "", "", "", "FX rate (AED per 1 USD)", "3.67", "linked to the FX rate in B23 (edit it there)"], ["Months", "12", "months (editable)", "", "", "", "ChatGPT AED per month (USD x FX)", "367.25", "AED per month, for the one shared subscription (calculated)"], ["Storage cost for the period", "", "", "4200", "", "", "Months", "12", "linked to the storage months in B29 (edit it there)"], ["Storage figure of about AED 350 per month is an approximate figure given by Keiffer and is pending approval. It is treated as a flat shared cost: it does not change with the number of ambassadors.", "", "", "", "", "", "Basis", "One shared subscription", "Dropdown: One shared subscription / Per ambassador. Default: one shared ChatGPT subscription is needed (per Keiffer); switch to Per ambassador only if that changes."], ["", "", "", "", "", "", "Include ChatGPT? (approved)", "Yes", "Yes / No - set to No if not approved"], ["Summary", "", "", "AED", "", "", "ChatGPT cost for the period", "4407", "AED per month x months x (1 shared subscription; number of ambassadors only if Basis is switched to Per ambassador)"], ["Number of ambassadors", "", "", "3", "", "", "", "", ""], ["One-off kit cost (ambassadors x kit per ambassador)", "", "", "5,431.03", "", "", "", "", ""], ["Storage cost for the period", "", "12 months", "4200", "", "", "", "", ""], ["ChatGPT subscription for the period", "", "12 months, 1 shared subscription", "4407", "", "", "", "", ""], ["Grand total (kit + storage + ChatGPT)", "", "", "14,038.03", "", "", "", "", ""], ["Scenarios", "Ambassadors", "One-off kit cost (AED)", "Storage (AED)", "ChatGPT (AED)", "Total AED", "", "", ""], ["1 ambassador", "1", "1,810.34", "4200", "4407", "10,417.34", "", "", ""], ["2 ambassadors", "2", "3,620.68", "4200", "4407", "12,227.68", "", "", ""], ["3 ambassadors", "3", "5,431.03", "4200", "4407", "14,038.03", "", "", ""], ["5 ambassadors", "5", "9,051.71", "4200", "4407", "17,658.71", "", "", ""], ["10 ambassadors", "10", "18,103.42", "4200", "4407", "26,710.42", "", "", ""], ["Storage is assumed to be a flat shared cost, so it is the same in every scenario; only the kit cost scales with the number of ambassadors. Only one ChatGPT subscription is needed (per Keiffer), so ChatGPT is also flat; it would scale with the number of ambassadors only if the Basis is switched to \"Per ambassador\".", "", "", "", "", "", "", "", ""], ["Roster update (5 Oct 2026)", "", "", "AED", "", "", "", "", ""], ["See Ambassadors tab. Ammar Zaky added: own camera + international driving licence. Kit for him is partial / TBC. Luna returned questionnaire 30 Sep.", "", "", "", "", "", "", "", ""], ["Kit cost now (N)", "", "", "5,431.03", "", "", "", "", ""], ["Kit cost with N+1", "", "", "7,241.37", "", "", "", "", ""], ["Extra kit cost for one more ambassador", "", "", "1,810.34", "", "", "", "", ""], ["Extra storage cost (flat shared cost, assumed unchanged)", "", "", "0", "", "", "", "", ""], ["ChatGPT cost now (N)", "", "", "4407", "", "", "", "", ""], ["ChatGPT cost with N+1", "", "", "4407", "", "", "", "", ""], ["Extra ChatGPT cost (AED 0 on the default One shared subscription; only if Basis is Per ambassador)", "", "", "0", "", "", "", "", ""], ["Extra total for one more ambassador", "", "", "1,810.34", "", "", "", "", ""], ["Grand total now (kit + storage + ChatGPT)", "", "", "14,038.03", "", "", "", "", ""], ["Grand total with N+1 (kit + storage + ChatGPT)", "", "", "15,848.37", "", "", "", "", ""], ["Note: Q9 in the Q&A form quoted ~AED 1,468 per kit, about AED 342 lower than this model (AED 1,810.34); still to be confirmed.", "", "", "", "", "", "", "", ""], ["Check: matches Kit per ambassador tab (AED 1,810.34)?", "", "", "OK", "", "", "", "", ""]]}, {"h": "Sheet: Business requirements"}, {"t": [["#", "Requirement", "Detail / notes from the doc", "Owner", "Status"], ["1", "Programme framework and scorecard", "The rules of the programme: roles, the ambassador journey from recruitment to onboarding to reviews, and the scorecard. Month-one scorecard measures: engagement / artisans signed / footage on time and to standard / cost per signed artisan (raw and market-adjusted) / profitability and fairness test. Underperformance follows a performance improvement plan with SMART goals, 30-day tracking and sandwich-style coaching.", "", ""], ["2", "Pay and incentive model", "Currently sales-based only: about 551 AED per signed and verified artisan, with no salary, retainer or fixed fee. Travel and support are case by case and specific. Regional SPV shares are under consideration, not confirmed. Compensation is internal and not disclosed to artisans. Pending team confirmation after the team discussion. Per the doc, Haseeb approves pay.", "", ""], ["3", "Artisan consent and agreement templates", "A signed consent or a simple written artisan agreement, covering consent to film and share, fair credit, and what happens to the content. This protects the artisans and the brand, and it is the base for the no-exploitation rule. Needs a review for the UAE and Colombia. Per the doc, Haseeb approves agreements.", "", ""], ["4", "Brand style guide with samples", "Communiverse's brand guidelines for ambassador content, with sample posts and clips of what good looks like (authentic / organic / honest, subtle on camera, focused on how things are made). Includes a one-page reference card for every ambassador.", "", ""], ["5", "Recruitment plan per city", "Start with warm intros from Luna and Hassan, post in artisan workshops, run one open call per city with a one-minute video prompt, and visit workshops first before mock-ups once there is a shortlist. For new cities, study the output from current ambassadors first, then apply the learnings. Still needed: a target list of cities and a shortlist process.", "", ""], ["6", "Budget and cost model", "Detail in the source doc covers the travel package model and kit costs; those figures are intentionally not reproduced here. Still needed (per the doc): a cap per trip and who books travel.", "", ""], ["7", "Reporting cadence to Haseeb and Elferah", "A fixed rhythm for updates, for example a short weekly update to Elferah on deadlines and a monthly review with Elferah and Haseeb on the scorecard, spend and decisions. Haseeb approves pay, agreements and the onboarding process. The exact cadence is to be agreed.", "", ""], ["8", "Legal and compliance basics for UAE and Colombia", "Check with a local adviser before scaling: how ambassadors are engaged (contractor or not, with no salary), consent and image rights for artisans, data protection and privacy for recordings, advertising and endorsement disclosure rules, and rules on filming in each place. Also confirm how the artisan-facing wording fits the consent and fair credit commitment. This list is a starting point for an adviser, not legal advice.", "", ""]]}, {"h": "Sheet: Technical requirements"}, {"t": [["#", "Requirement", "Detail / notes from the doc", "Owner", "Status"], ["1", "CRM", "Tracks artisans, ambassadors and content in one place, and measures timely delivery. monday.com is one option from the top of my head, but a more custom setup is preferred. The team will decide which CRM is best.", "", ""], ["2", "Content management", "A shared home for the style guide, reference cards and approved sample content, with version control so ambassadors always use the current version.", "", ""], ["3", "Dashboard", "Automates the scorecard metrics and flags underperformance, for example when the 30-day tracking falls behind. It pulls from the CRM and analytics.", "", ""], ["4", "Consent and agreement storage", "Secure storage for signed consents and artisan agreements, linked to each artisan and ambassador record, with retrieval when asked.", "", ""], ["5", "Communication channels", "A community chat for ambassadors, for announcements / questions / sharing wins / the monthly showcase. Plus one place for updates to Haseeb and Elferah.", "", ""], ["6", "Basic analytics", "Reach / engagement / bookings / sales, per ambassador and per city, so the cost per signed artisan and the profitability and fairness test can be calculated.", "", ""]]}, {"h": "Sheet: Open questions"}, {"t": [["#", "Question", "Answer (latest Q&A form, v17)"], ["Q1", "Describe the ideal Communiverse ambassador. Who should we never sign?", "The ideal ambassador is curious / warm / rooted in their city / committed / honest / comfortable but subtle on camera / understands handmade work / has a small but engaged audience. They share Communiverse's values and are genuinely into connecting artisans to the world and the right community. They do not need to be polished on camera. Communiverse wants to capture real moments, so the camera presence should stay subtle. We never sign someone who pressures artisans or promises what we can't deliver."], ["Q2", "What is the biggest risk in the first 30 days, and how will you handle it?", "I don't see a major risk. The main thing in the first 30 days is my own learning of the role. In the first 30 days I will make sure each ambassador's content matches the brand / streamline content so it complements the Communiverse brand guidelines / identify each ambassador's strengths and assign their key needs / leverage their strengths to advance their goals."], ["Q3", "Which metrics will you use in month one?", "Engagement / artisans signed / footage delivered on time and to standard. Cost per signed artisan, both raw and market-adjusted (the artisan acquisition cost), per ambassador. Profitability and fairness test: it tracks each ambassador's pace against other ambassadors' performance and payment. This ensures no ambassador is over- or under-rewarded relative to their output and local market costs. A CRM is needed to measure timely delivery. monday.com is one option off the top of my head, but I prefer something more custom. I will discuss with the team which CRM is best."], ["Q4", "How will you recruit ambassadors?", "Start with warm intros from Luna and Hassan: two or three names each, in their city, who already film or post about local makers. Post in artisan workshops, where the audience already gathers. Run one open call per city with a simple one-minute video prompt, to see how candidates come across on camera before discussing rates. Do workshop visits first to find people who already live this and to gather content. Move to mock-ups once there is a shortlist."], ["Q5", "How will ambassadors be paid?", "Ambassadors are not paid a monthly salary, retainer or fixed fee. Compensation is based solely on the sales of the artisans they recruit. No per-artisan fee amount is set in this form. Under consideration, not confirmed: ambassadors who become really comfortable with the programme may be offered shares in the regional SPV as an additional long-term incentive, on top of the sales-based pay. Ambassador compensation (the sales-based pay and any possible SPV shares) is strictly internal. Ambassadors must not tell artisans that they receive money from the artisan's sales. It is how Communiverse compensates the ambassador and is not disclosed to artisans. Travel and other support for ambassadors is not pay. It is controlled case by case, depending on need, and must be specific."], ["Q6", "What happens when an ambassador underperforms?", "A performance improvement plan with coaching / SMART goals (Specific / Measurable / Achievable / Relevant / Time-bound) / 30-day tracking. Tracking is automated through a scorecard dashboard. Coaching uses the sandwich approach: agree what went well / what needs improvement / what could be done better."], ["Q7", "How will you keep ambassadors engaged and retain them?", "Monthly showcase or reward for emerging leaders / top points system / leaderboard / rotating exclusives. Google Local Guides style points that earn better destinations."], ["Q8", "How will you handle brand drift and protect artisans?", "Coaching, with a reference card for every ambassador. Coach first and explain why. No exploitation of artisans. They give consent and receive fair credit, backed by a signed consent or a simple written artisan agreement."], ["Q9", "What equipment do ambassadors need?", "The standard kit for everyone is the DJI Osmo Nano (about 1,281 AED) plus a tripod (55 to 184 AED). That is about 1,468 AED per ambassador. Meta glasses are out of the standard kit because they are restricted in some countries. They may be considered later as a sponsored item. Idea: approach a tech partner for sponsorship. Luna needs training with me."], ["Q10", "How will you recruit in new cities?", "Study the output generated by current ambassadors first, then apply those learnings to target other cities."], ["Q11", "What is your approach to being on camera and to the artisans?", "Never exploitative / authentic / organic / honest. The focus is on creative bidding and VR content, and on how things are made. Authenticity is key."], ["Q12", "How many hours a week can you commit?", "25 hours a week, in 3 to 4 focused hours each day."], ["Q13", "What are your blockers?", "The learning curve is the main blocker. What I need to learn: the ambassador programme and onboarding process / the CRM and scorecard dashboard for tracking delivery and performance / Communiverse's brand guidelines / how to coach ambassadors, including training them on video and storytelling."], ["Q14", "Is anything unclear in the brief?", "Nothing unclear for now."]]}, {"h": "Sheet: Equipment"}, {"t": [["Equipment - per-ambassador kit items, with sources", "", "", "", "", "", ""], ["Every row cites its source file / cell / question. Nothing here is invented: where the sources give no figure the cell says TBC (yellow). Prices are public-listing estimates seen 1 Oct 2026 (not quotes). Section A is the priced standard kit (adds up). Sections B-D are reference only and are NOT added to Section A.", "", "", "", "", "", ""], ["Item", "Category", "Qty per ambassador", "Unit cost (currency as stated)", "Line total", "Source", "Notes"], ["A. Standard kit - priced items (from the Travel Package Model, sheet Kit)", "", "", "", "", "", ""], ["DJI Osmo Nano Standard Combo 128GB (neck-worn 4K camera)", "camera", "1", "1,499", "1499", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!A5:I5 (source ID S44: alGadgets UAE); also ambassador_travel_model_summary.md (Equipment kit paragraph)", "Status in model: In standard kit. 128GB chosen because the camera has 107.6GB usable internal storage and cannot record directly to microSD (Kit!I5). Q9 of the Q&A form quotes a lower figure (about AED 1,281) - see section B and the discrepancy note on the Kit per ambassador tab."], ["Mini tripod - Neewer TP35 flexible tripod + remote (default)", "tripod", "1", "54.99", "54.99", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!A6:I6 (source ID S46: Amazon.ae)", "Status in model: In standard kit. Amazon.ae AED 54.99 (list AED 75). Upgrade option: Joby GorillaPod 1K - see section C."], ["microSD card 256GB V30 (offload/backup; SanDisk Extreme as placeholder)", "storage", "1", "24.99", "24.99", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!A7:I7 (source ID S48: B&H)", "Status in model: In standard kit. B&H USD 24.99 (was USD 38.99); price is volatile (Amazon.com lists USD 66.60). Priced in USD at source; converted to AED on the Kit per ambassador tab at the peg AED 3.6725/USD (Assumptions!B6)."], ["Kit contingency (replacement / accessories / shipping) - 10% of kit subtotal", "other", "1", "see Kit per ambassador tab", "see Kit per ambassador tab", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!A11:G11; rate 10% = Assumptions!B22", "Shown on the Kit per ambassador tab in AED (cleaner there because the kit mixes AED and USD items). Row kept here for completeness; see that tab for the amount."], ["Vision Dock (needed to offload Osmo Nano footage to microSD)", "storage", "TBC", "TBC", "TBC", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!I7 (\"check the dock is in the combo\")", "The model says the Osmo Nano exports footage to microSD via the Vision Dock, and to check the dock is in the combo. Whether it is included, and any extra cost, is not confirmed in the sources."], ["Categories with no item defined in any source file", "", "", "", "", "", ""], ["TBC - no audio item specified in sources", "audio", "TBC", "TBC", "TBC", "Checked: Communiverse_Ambassador_QA_Form_Keiffer_FINAL_v17.docx (Q9), Communiverse_Ambassador_Programme_Foundations.docx (Section 1 item 6), Communiverse_Ambassador_Travel_Package_Model.xlsx (Kit sheet), ambassador_travel_model_summary.md", "No audio item (e.g. microphone) is listed in the Q&A form, Foundations doc, model or summary. Add only if the team decides one is needed."], ["TBC - no lighting item specified in sources", "lighting", "TBC", "TBC", "TBC", "Checked: Communiverse_Ambassador_QA_Form_Keiffer_FINAL_v17.docx (Q9), Communiverse_Ambassador_Programme_Foundations.docx (Section 1 item 6), Communiverse_Ambassador_Travel_Package_Model.xlsx (Kit sheet), ambassador_travel_model_summary.md", "No lighting item is listed in the Q&A form, Foundations doc, model or summary. Add only if the team decides one is needed."], ["B. Kit as stated in the Q&A form (Q9) and Foundations doc - reference, NOT added to section A", "", "", "", "", "", ""], ["DJI Osmo Nano (as quoted in Q9)", "camera", "1", "1,281", "1281", "Communiverse_Ambassador_QA_Form_Keiffer_FINAL_v17.docx > Q9 (\"DJI Osmo Nano (about 1,281 AED)\"); same wording carried in the existing sheet tab \"Open questions\" row Q9", "Stated as \"about\" 1,281 AED. Model of 1 Oct 2026 prices the 128GB combo at AED 1,499 instead; the basis of the 1,281 figure (variant/retailer) is not stated -> TBC."], ["Tripod (as quoted in Q9)", "tripod", "1", "AED 55 to 184 (range)", "AED 55 to 184", "Communiverse_Ambassador_QA_Form_Keiffer_FINAL_v17.docx > Q9 (\"a tripod (55 to 184 AED)\")", "Range as stated; no specific tripod model named in Q9. Model default (Neewer TP35, AED 54.99) sits at the low end; GorillaPod 1K at AED 89-129 is in the range."], ["Total standard kit per ambassador (as stated)", "other", "1", "about AED 1,468", "about AED 1,468", "Communiverse_Ambassador_QA_Form_Keiffer_FINAL_v17.docx > Q9 (\"about 1,468 AED per ambassador\"); Communiverse_Ambassador_Programme_Foundations.docx > Section 1, item 6 (Budget and cost model)", "Stated total. Note 1,281 + 184 = 1,465, so \"about 1,468\" is approximate. Excludes memory card and contingency."], ["C. Alternatives / reference prices - NOT in kit, not in any total", "", "", "", "", "", ""], ["DJI Osmo Nano 128GB - Jumbo Electronics UAE (alternative retailer)", "camera", "0", "1,569", "0", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!I5 (S44)", "Reference price only."], ["DJI Osmo Nano 64GB - UAE (Jumbo / alGadgets)", "camera", "0", "AED 1,449 (Jumbo) / AED 1,450 (alGadgets)", "n/a (not in kit)", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!A15:B15", "Reference only; 64GB variant has only 48GB usable (S49 in Sources sheet)."], ["DJI Osmo Nano - DJI USA (64GB / 128GB)", "camera", "0", "USD 349 / USD 409", "n/a (not in kit)", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!A16:B16 (DJI USA page 28 Aug 2026)", "Reference only (64GB shown as \"was USD 389\")."], ["Joby GorillaPod 1K (upgrade option)", "tripod", "0", "AED 89 (stand) / AED 129 (with ball head)", "n/a (not in kit)", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!I6, Kit!A17:B17 (S47: BHM Store UAE); ambassador_travel_model_summary.md", "Upgrade option mentioned in the summary as AED 89-129; another UAE shop lists AED 109 kit."], ["Neewer TP35 - US price", "tripod", "0", "25.99", "0", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!I6, Kit!A18:B18 (neewer.com)", "Reference only."], ["microSD 256GB SanDisk Extreme - Amazon.com price", "storage", "0", "66.6", "0", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!A19:B19", "Shows price volatility vs B&H USD 24.99."], ["D. Excluded / possible future items", "", "", "", "", "", ""], ["Meta glasses (smart glasses)", "other", "0", "TBC (no price in sources; USD 0 in model totals)", "not budgeted", "Communiverse_Ambassador_QA_Form_Keiffer_FINAL_v17.docx > Q9; Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!A8:I8; ambassador_travel_model_summary.md", "Out of the standard kit because restricted in some countries. May be considered later as a sponsored item."], ["Tech-partner sponsorship of equipment (idea)", "other", "TBC", "TBC", "TBC", "Communiverse_Ambassador_QA_Form_Keiffer_FINAL_v17.docx > Q9 (\"Idea: approach a tech partner for sponsorship\")", "An idea only - no partner, item list or value stated."], ["E. Programme totals (driven by Number of ambassadors on the Simple cost tab)", "", "", "", "", "", ""], ["Number of ambassadors", "", "3", "", "", "Simple cost!B3 (single input - edit it there)", "Linked; do not overwrite."], ["Kit total per ambassador (AED)", "", "1,810.34", "", "", "Kit per ambassador!E13", "Section A items plus 10% contingency."], ["Programme kit cost - one-off (AED)", "", "5,431.03", "", "", "Number of ambassadors x kit total per ambassador", "One kit per ambassador, reused (not bought per event)."], ["Storage for the period (AED)", "", "4200", "", "", "Simple cost!B27:B29, D30", "Approximate AED 350/month figure given by Keiffer, pending approval; flat shared cost."], ["ChatGPT subscription for the period (AED)", "", "4407", "", "", "Simple cost!H27:H33", "Approximate USD 100/month figure given by Keiffer, to be confirmed. Only one ChatGPT subscription is needed (per Keiffer), so this is flat by default (Basis = One shared subscription); it scales with ambassadors only if Basis is switched to Per ambassador. Shown as 0 if \"Include ChatGPT?\" is No."], ["Grand total - kit + storage + ChatGPT (AED)", "", "14,038.03", "", "", "Kit cost + storage + ChatGPT", "Matches 'Simple cost'!D38."]]}, {"h": "Sheet: Kit per ambassador"}, {"t": [["Kit per ambassador", "", "", "", "", "", ""], ["No tiers or roles are defined for equipment in any source file. Q9 says \"The standard kit for everyone is...\" so this tab shows a SINGLE standard kit for all ambassadors (UAE, Colombia/Luna, India, Egypt). Two totals exist in the sources and they differ - both are shown, not merged (see \"Discrepancy\" below).", "", "", "", "", "", ""], ["AED per 1 USD (used only to convert the USD-priced microSD)", "", "", "3.67", "", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Assumptions!B6 (official AED/USD peg)", ""], ["Item", "Category", "Qty", "Unit cost (currency as stated)", "Line total (AED)", "Source", "Notes"], ["1. Standard kit per ambassador - priced (Travel Package Model, sheet Kit)", "", "", "", "", "", ""], ["DJI Osmo Nano Standard Combo 128GB", "camera", "1", "1,499", "1499", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!A5:I5 (S44)", "Equipment!A6 has full notes."], ["Mini tripod - Neewer TP35 + remote", "tripod", "1", "54.99", "54.99", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!A6:I6 (S46)", ""], ["microSD card 256GB V30", "storage", "1", "24.99", "91.78", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!A7:I7 (S48)", "Unit cost is USD 24.99; line total converted to AED at the rate in D4."], ["Kit subtotal", "", "", "", "1,645.77", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!G10", "Model shows AED 1,645.77 (USD 448.13)."], ["Kit contingency 10% (replacement / accessories / shipping)", "other", "", "10% of subtotal", "164.58", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!A11:G11; rate = Assumptions!B22", ""], ["TOTAL per ambassador - travel-model kit (AED)", "", "", "", "1,810.34", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!G12; ambassador_travel_model_summary.md (\"US$493 (AED 1,810) per ambassador\")", "Matches the model total AED 1,810.34."], ["Same total in USD (for reference)", "", "", "", "492.95", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!F12", "Model shows USD 492.95."], ["Not priced / TBC: Vision Dock, audio, lighting", "storage / audio / lighting", "TBC", "TBC", "TBC", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Kit!I7; see Equipment tab", "Not included in the total above. Sources do not define them."], ["2. Kit as stated in the Q&A form (Q9) and Foundations doc", "", "", "", "", "", ""], ["DJI Osmo Nano", "camera", "1", "1,281", "1281", "Communiverse_Ambassador_QA_Form_Keiffer_FINAL_v17.docx > Q9", "\"about 1,281 AED\""], ["Tripod", "tripod", "1", "AED 55 to 184", "AED 55 to 184", "Communiverse_Ambassador_QA_Form_Keiffer_FINAL_v17.docx > Q9", "Range; model not named."], ["TOTAL per ambassador - as stated in docs (AED)", "", "", "", "about AED 1,468", "Communiverse_Ambassador_QA_Form_Keiffer_FINAL_v17.docx > Q9; Communiverse_Ambassador_Programme_Foundations.docx > Section 1 item 6", "Stated total. No memory card, no contingency."], ["Discrepancy to resolve", "", "", "", "", "", ""], ["Docs total (about AED 1,468) vs model total (AED 1,810.34)", "", "", "", "342.34", "Calculated: model total minus Q9 total", "Difference of about AED 342 comes from: Osmo Nano priced AED 1,499 (128GB, alGadgets) vs about AED 1,281 in Q9; microSD card (USD 24.99) and 10% kit contingency are in the model but not in Q9. Which figure is the approved kit budget is TBC - to confirm with Keiffer / Haseeb."], ["Programme-level view", "", "", "", "", "", ""], ["Number of ambassadors", "", "3", "", "3", "Linked to 'Simple cost'!B3 (Number of ambassadors) - change it there, not here.", "Number of ambassadors comes from the single input on the Simple cost tab (currently a working assumption; the sources do not state a headcount - only regions UAE, Colombia, India, Egypt and individuals Luna and Hassan)."], ["Total kit budget - travel-model kit (AED)", "", "", "", "5,431.03", "Number of ambassadors x total per ambassador", "Calculates automatically from the ambassador count in C26, which is linked to 'Simple cost'!B3."], ["Kit reuse across trips (one kit kept per ambassador vs reused)", "", "TBC", "", "TBC", "Communiverse_Ambassador_Travel_Package_Model.xlsx > Open_Questions row 10", "Open question for Haseeb; the model charges the kit 100% to each trip by default."], ["Possible sponsorship / Meta glasses", "", "TBC", "", "TBC", "Communiverse_Ambassador_QA_Form_Keiffer_FINAL_v17.docx > Q9", "Meta glasses not in the standard kit; tech-partner sponsorship is an idea only. No value stated."], ["Storage for the period (AED) - approx. AED 350/month, pending approval", "", "", "", "4200", "'Simple cost'!B27:B29 and D30", "Approximate figure given by Keiffer, pending approval; flat shared cost, not per ambassador. Shown as 0 if \"Include storage?\" is set to No."], ["ChatGPT subscription for the period (AED) - approx. USD 100/month, to be confirmed", "", "", "", "4407", "'Simple cost'!H27:H33", "Approximate figure given by Keiffer, to be confirmed. Only one ChatGPT subscription is needed (per Keiffer): the Basis dropdown defaults to One shared subscription and can be switched to Per ambassador. Shown as 0 if \"Include ChatGPT?\" is set to No."], ["Grand total - kit + storage + ChatGPT (AED)", "", "", "", "14,038.03", "Kit budget (E27) + storage (E30) + ChatGPT (E31)", "Should equal 'Simple cost'!D38."]]}], "size": 187566}, "d23": {"name": "Artist contacts - OMIC event 2026-10-12 (CONTAINS PERSONAL DATA - redact before external share).docx", "sec": "08 Traction & Pipeline", "ext": "docx", "blocks": [{"p": "Artist contacts from the OMIC event"}, {"p": "Source: Gmail, sent 12 Oct 2026 by Keiffer Japeth to Haseeb Wasim and Elferah."}, {"p": "Contacts collected at the Living Room show at OMIC in Al Quoz:"}, {"p": "1. Miss Petunia, Artist, UAE, [phone redacted]"}, {"p": "2. Narges, OMIC (curator), [phone redacted]"}, {"p": "3. Chandana, Artist, [phone redacted]"}, {"p": "4. Tamara Vasilenko, Embroidery and Fine Art, Dubai/UAE, [phone redacted], Instagram @tvasilenko.art. Her profile mentions Sharjah Art Foundation, Al Shindagha Historical Neighbourhood and OMIC Gallery."}, {"p": "5. Mrs. Helichrysum, Artist, UAE, Instagram @mrs.helichrysum (\"A Little Story Account\", linked to Artistic Hub). No phone number yet."}], "size": 7380}, "d24": {"name": "Dubai Art Ev re building, with dated milestones. Status codes are the same G / A / R as above."}, {"p": "Format per item: Item (folder) [RAG] \u2014 Amaya: what the reviewer checks \u00b7 IDI pillar \u00b7 ADI group \u00b7 Clara risk / answer type."}, {"p": "BUILT, WITH EVIDENCE"}, {"p": "Executive Summary + Key Figures (00) [G] \u2014 Amaya: every figure traceable to a dated source \u00b7 IDI: all pillars (Overview) \u00b7 ADI: \u2014 \u00b7 Clara: Fact; any number that differs from Key Figures is flagged as a contradiction."}, {"p": "Product Status Note: live vs simulated (02) [A] \u2014 Amaya: is the product real and what is simulated \u00b7 IDI 1 AI-Readiness, 2 Technology & Product \u00b7 ADI: Adaptive Capacity \u00b7 Clara: Fact; never say RAL is 'trained' or 'running'. Needs Louis's sign-off."}, {"p": "Product demo, Plug, waitlist site (02, links) [A] \u2014 Amaya: live surfaces match the deck \u00b7 IDI 2 Technology & Product \u00b7 ADI: Adaptive Capacity \u00b7 Clara: Fact; Plug clean-up (113 hosts, 0 confirmed slots [KF-21]) and the waitlist copy fix must happen first."}, {"p": "Defensibility & Moat Memo (03) [G] \u2014 Amaya: moat stated as hypothesis with proof milestones \u00b7 IDI 3 Data & Model Position \u00b7 ADI: External Pressure \u00b7 Clara: Assertion (label as hypothesis)."}, {"p": "Ambassador questionnaires, briefs, Foundations (04) [A] \u2014 Amaya: team and go-to-market capability \u00b7 IDI 4 Team & Org \u00b7 ADI: Internal Resilience \u00b7 Clara: Fact ('3 recruited and profiled, 0 under signed terms' [KF-28]); consent needed before sharing."}, {"p": "Market Sizing TAM/SAM/SOM (06) [A] \u2014 Amaya: bottom-up, sourced, not summed \u00b7 IDI 6 Market & Commercial \u00b7 ADI: External Pressure \u00b7 Clara: Fact for sourced inputs, Forecast for SOM."}, {"p": "Competitor Landscape + research (06) [A] \u2014 Amaya: honest substitutes and closest analogues \u00b7 IDI 6 Market & Commercial \u00b7 ADI: External Pressure (substitution, disintermediation) \u00b7 6, KF-19, KF-25]."}, {"p": "Financial model, cap table, SAFE terms, commitment + bank evidence (07) [R] \u2014 IDI 7 Capital & Resilience \u00b7 ADI: Internal Resilience (unit economics) \u00b7 Clara: Forecast (model) and Fact (SAFE) [KF-01 to KF-08]."}, {"p": "WHAT WE ARE BUILDING (roadmap, stated as targets)"}, {"p": "Roadmap and milestones: UAE launch Q1 2027, Colombia hub Q2 2027, two live hubs Q4 2027, regional marketplace betas 2028 [KF-44]; marketplace date conflict s9 vs s15 open [KF-43] \u2014 IDI 7 Capital & Resilience, 6 Market \u00b7 ADI: Adaptive Capacity (velocity) \u00b7 Clara: Commitment; each needs an owner and a measurable proof point."}, {"p": "RAL agents, verification protocol, booking-to-delivery data \u2014 IDI 1, 3 \u00b7 ADI: Adaptive Capacity \u00b7 Clara: Forecast ('designed to', 'target')."}, {"p": "Language rules for the room (pre-seed): no urgency ('closing soon', 'last allocation'), no 'buy' or offer language, no hype ('revolutionary', 'skip the problems altogether'), no guaranteed or projected returns, no 'break-even' without a filed model. Use 'built' only for things a reviewer can open today; use 'building', 'designed to' or 'target' for everything else. Untraceable claims get UNVERIFIED."}], "size": 15396}, "d26": {"name": "Clara Interview Prep - 20 Q&A.docx", "sec": "99 INTERNAL - Prep (remove before sharing with Amaya)", "ext": "docx", "blocks": [{"p": "Clara Interview Prep: 20 Q&A (Haseeb + Keiffer)"}, {"p": "INTERNAL \u00b7 15 Oct 2026. Clara sorts every statement into Fact / Assertion / Forecast / Commitment and flags contradictions with the deck, the data room and the live sites. Use only figures in the Key Figures sheet. Never round in our favour, and say \"we don't know yet\" when that's true."}, {"t": [["#", "Likely question", "Answer to hold to", "Type", "Evidence", "KF"], ["1", "How much are you raising, and how much is committed?", "\"$750k on a YC SAFE: $50k legally committed, $50k soft, $650k open.\" Have the cap and discount ready", "Fact", "SAFE (07)", "KF-01 to KF-05"], ["2", "Why is the $50k still soft?", "The real reason (bank-account setup) and the date it closes", "Fact + Commitment", "Bank confirmation", "KF-03"], ["3", "How many buyers did you survey?", "One number, from the raw data: \"n = __, office workers in Dubai, [month] 2026. An early signal, not a market study.\" Never say both 50 and 25", "Fact", "Survey file (08)", "KF-16, KF-17"], ["4", "Who are the 100+ artists?", "\"People we spoke to at events in the UAE, Colombia, the UK, Ireland, India, Pakistan and the Philippines. The log is in the data room.\" Don't call them signed", "Fact", "Conversation log", "KF-19"], ["5", "How many artisans are signed?", "\"None under formal agreement yet. We're scouting: 14 Dubai exhibitions this fortnight and 5 contacts from OMIC.\"", "Fact", "08", "KF-20, KF-26, KF-27"], ["6", "What does RAL do today?", "\"Today RAL is a scripted simulation of the operating model. In production we use third-party AI for search and drafts. The agents are next.\" Never say \"trained on our data\"", "Fact", "Product Status note", "KF-38, KF-41"], ["7", "How can 2\u20134 people run a country?", "\"It's a design target. We'll measure it in the UAE hub in 2027.\"", "Forecast", "\u2014", "KF-40"], ["8", "Are ambassadors in place?", "\"Three are recruited and profiled: Luna, Ammar and Balo. Terms are being finalised, and onboarding follows the legal check.\"", "Fact + Commitment", "Questionnaires (04)", "KF-28"], ["9", "How are ambassadors paid?", "The single agreed model. If it isn't decided: \"We're testing AED 551 (\u2248 US$150) per signed, verified artisan plus expense-paid trips; regional upside is under review.\"", "Fact / Commitment", "Foundations (04)", "KF-29"], ["10", "Who are your corporate clients?", "\"None signed: no paid contracts or LOIs. We've had exploratory conversations.\" Don't call Casio a client", "Fact", "Deck s12", "KF-23"], ["11", "What's your TAM / SAM / SOM?", "\"The global markets are context. Our SAM is bottom-up from Dubai: about 12.36m culturally engaged visitors and 4.58m residents, with a session at about US$57\u201360. The SOM comes from the model.\"", "Fact + Forecast", "Market Sizing (06)", "KF-50 to KF-56"], ["12", "\"No platform above 0.5%\"? Etsy is about $12bn", "\"You're right. Etsy's GMS is about 1.2% of IMARC's estimate, and we've corrected the slide. The point is fragmentation.\"", "Fact", "Landscape (06)", "KF-46"], ["13", "Who else sells bookable artist time?", "\"Experience platforms do, but none verifies the maker or keeps the relationship going. Saatchi verifies, but doesn't sell sessions.\"", "Assertion + evidence", "Landscape", "\u2014"], ["14", "Why are deceased or unconsented artists bookable on Plug?", "(After clean-up) \"That was prototype data from public gallery listings. Hosts now appear only once they've confirmed and consented.\"", "Fact", "Changelog", "KF-21"], ["15", "Who owns the code and domains?", "\"Common Folk Group, Inc., under IP assignments. The asset register is in 05.\" If not done: \"Assignments are being signed this month.\"", "Fact / Commitment", "IP pack", "\u2014"], ["16", "When and where do you launch?", "\"UAE in Q1 2027, the Colombia hub in Q2 2027, regional marketplace betas in 2028.\"", "Commitment", "Deck s15", "KF-44, KF-43"], ["17", "When do you break even?", "Only the model's month, labelled as modelled, or: \"We'll share it once the model is final.\"", "Forecast", "Model", "KF-07"], ["18", "What's the team's time commitment?", "Per person, FT/PT. \"Keiffer: 25 hours a week.\" Others from the team appendix", "Fact", "Team appendix", "KF-35, KF-36"], ["19", "Is Alison an investor or on the team?", "One answer that matches the advisor list and the cap table", "Fact", "Advisor list", "KF-37"], ["20", "How does Communiverse survive AI?", "\"We sell verified human-made work and live sessions. AI runs the admin, never the craft. Verification and in-person sessions get more valuable as synthetic content grows.\"", "Assertion", "Deck s2, Defensibility memo", "KF-60"]]}, {"p": "Phrases that will be tagged: \"trained on our own data\" \u00b7 \"3 ambassadors in place\" \u00b7 \"signed and verified makers\" \u00b7 \"Casio is a client\" \u00b7 \"we skip the problems ... altogether\" \u00b7 \"no competitor sells bookable time with artists\" \u00b7 \"break-even\" without a model \u00b7 \"66+ countries\" without a source."}, {"p": "Rehearsal: 60\u201390 minutes on Sunday 18 Oct. Haseeb answers first; Keiffer covers 5, 8, 9, 11, 13, 14 and 18."}, {"p": "Pre-seed framing (added 15 Oct 2026, 3:15 PM Dubai)"}, {"p": "Clara is an assessment, not a sales meeting. Don't pitch, don't create urgency, and never promise returns or a close date. Lead every answer with what is built and evidenced, then what we are building and the milestone that proves it."}, {"p": "21. 'Why invest now?' \u2192 \"We're at pre-seed. Here is what we've built: a live demo, a waitlist site, a booking flow, three profiled ambassadors and a scouting pipeline. Here is what this round funds: two hubs and the first verified artisans, with UAE launch targeted for Q1 2027.\" Type: Fact + Commitment [KF-28, KF-44]."}, {"p": "22. 'What returns do you expect?' \u2192 \"We won't quote returns. The financial model is being finalised; we'll share modelled cases, labelled as such.\" Type: Forecast [KF-07]."}, {"p": "23. 'What would make you not ready?' \u2192 Name the gaps ourselves: no signed artisans, RAL not built, model and legal documents pending. Type: Fact [KF-20, KF-38]."}, {"p": "Team answer update (deck v2): Abel Thomas is not on the team; don't credit him with current work. Q15 answer depends on IP assignments being filed (UNVERIFIED until then) [KF-65]. Q14 answer is only true after the Plug clean-up is done and checked."}], "size": 12908}, "d27": {"name": "Communiverse Data Room - Items Needed.pdf", "sec": "99 INTERNAL - Prep (remove before sharing with Amaya)", "ext": "pdf", "blocks":
