\"No platform above 0.5%\"? Etsy is about $12bn", "\"You're right. Etsy's GMS is about 1.2% of IMARC's estimate, and we've corrected the slide. The point is fragmentation.\"", "Fact", "Landscape (06)", "KF-46"], ["13", "Who else sells bookable artist time?", "\"Experience platforms do, but none verifies the maker or keeps the relationship going. Saatchi verifies, but doesn't sell sessions.\"", "Assertion + evidence", "Landscape", "\u2014"], ["14", "Why are deceased or unconsented artists bookable on Plug?", "(After clean-up) \"That was prototype data from public gallery listings. Hosts now appear only once they've confirmed and consented.\"", "Fact", "Changelog", "KF-21"], ["15", "Who owns the code and domains?", "\"Common Folk Group, Inc., under IP assignments. The asset register is in 05.\" If not done: \"Assignments are being signed this month.\"", "Fact / Commitment", "IP pack", "\u2014"], ["16", "When and where do you launch?", "\"UAE in Q1 2027, the Colombia hub in Q2 2027, regional marketplace betas in 2028.\"", "Commitment", "Deck s15", "KF-44, KF-43"], ["17", "When do you break even?", "Only the model's month, labelled as modelled, or: \"We'll share it once the model is final.\"", "Forecast", "Model", "KF-07"], ["18", "What's the team's time commitment?", "Per person, FT/PT. \"Keiffer: 25 hours a week.\" Others from the team appendix", "Fact", "Team appendix", "KF-35, KF-36"], ["19", "Is Alison an investor or on the team?", "One answer that matches the advisor list and the cap table", "Fact", "Advisor list", "KF-37"], ["20", "How does Communiverse survive AI?", "\"We sell verified human-made work and live sessions. AI runs the admin, never the craft. Verification and in-person sessions get more valuable as synthetic content grows.\"", "Assertion", "Deck s2, Defensibility memo", "KF-60"]], "chk": [["Overview", "Data Room Index, Executive Summary, Key Figures sheet", "00", "Keiffer", "G", "Built 15 Oct"], ["Overview", "Deck v1 (valid 6.9 MB copy)", "01", "\u2014", "A", "Filed. Corrections pending (36 items)"], ["Overview", "Deck v2", "01", "Haseeb", "R", "Filed 15 Oct (folder 01, unchanged). Review = RED: 0 of 36 fixes done, 32 open, 13 new issues (Deck v2 Review, 99). Stays R until corrected"], ["1 AI-Readiness", "RAL build-status note (live vs simulated)", "02", "Keiffer \u2192 Louis sign-off", "A", "Product Status note written; Louis to confirm"], ["1 AI-Readiness", "AI strategy / human-in-the-loop statement", "02", "Haseeb + Louis", "A", "Covered in the Product Status note; deck s7 wording needs a fix"], ["2 Technology & Product", "Demo link", "02", "\u2014", "G", "communiversedemo.xyz is live; label sample data"], ["2 Technology & Product", "Prototype video + UX videos", "02", "Keiffer", "R", "Not recorded"], ["2 Technology & Product", "Plug clean-up (unconsented/deceased hosts, \"fictional previews\")", "live site", "Keiffer + Haseeb", "R", "Must happen before any reviewer clicks"], ["2 Technology & Product", "Team sign-in security fix confirmed", "live site", "Keiffer", "R", "Not re-tested"], ["2 Technology & Product", "Architecture sketch", "02", "Abel", "R", "\u2014"], ["3 Data & Model Position", "Defensibility & Moat memo", "03", "Keiffer", "G", "Built 15 Oct"], ["3 Data & Model Position", "Data inventory (what's captured, consent records)", "03", "Haseeb + Louis", "R", "\u2014"], ["4 Team & Org", "Ambassador questionnaires, sent and received (Luna, Ammar, Balo) + briefs + Foundations", "04", "Keiffer", "A", "Filed. Get ambassador consent before sharing personal details"], ["4 Team & Org", "Ambassador pay model decision", "04", "Haseeb", "R", "KF-29"], ["4 Team & Org", "Team appendix (bios, evidence, FT/PT)", "04", "Haseeb", "R", "\u2014"], ["4 Team & Org", "Advisor list", "04", "Haseeb", "R", "KF-37"], ["4 Team & Org", "One title per person", "deck", "Haseeb", "A", "KF-36"], ["5 Legal & Regulatory", "Certificate of incorporation; entity structure note", "05", "Haseeb", "R", "\u2014"], ["5 Legal & Regulatory", "IP assignments + asset register", "05", "Haseeb", "R", "Plug hosting sits in Keiffer's Cloudflare"], ["5 Legal & Regulatory", "Artisan consent template; ambassador agreement", "05", "Haseeb + Keiffer", "R", "Foundations lists both as to-do"], ["5 Legal & Regulatory", "Privacy: redact OMIC contacts and ambassador personal data", "08 / 04", "Keiffer", "A", "Copies flagged"], ["6 Market & Commercial", "TAM/SAM/SOM", "06", "Keiffer", "A", "Built; SOM inputs GAP pending the model"], ["6 Market & Commercial", "Merged Competitor Landscape + research source", "06", "Keiffer", "A", "Built; full URLs still to add (C-4)"], ["6 Market & Commercial", "Survey raw data", "08", "Haseeb", "R", "KF-16"], ["7 Capital & Resilience", "Financial model", "07", "Haseeb", "R", "KF-07"], ["7 Capital & Resilience", "Cap table, SAFE + terms, commitment evidence, bank account", "07", "Haseeb", "R", "KF-02 to KF-05"], ["7 Capital & Resilience", "Ambassador cost inputs (travel model, equipment v6)", "07", "Keiffer", "A", "Estimates, not quotes"], ["Traction & Pipeline", "Dubai Art Events sheet (Luna)", "08", "Keiffer / Luna", "A", "Plan only; add outcome columns in a new copy after visits"], ["Traction & Pipeline", "OMIC artist contacts", "08", "Keiffer", "A", "Redact before sharing"], ["Traction & Pipeline", "Conversation log (100+)", "08", "Haseeb + Keiffer", "R", "KF-19"], ["Traction & Pipeline", "Waitlist count with date", "08", "Haseeb", "R", "KF-25"], ["Interview", "Clara prep (20 Q&A) and rehearsal", "99", "Both", "A", "Rehearse Sunday"]], "mapping": ["Assessment mapping: Amaya, IDI, ADI and Clara (pre-seed stage)", "Stage: pre-seed. Added 15 Oct 2026, 3:15 PM Dubai. Communiverse is not selling anything to the fund. Amaya and the fund's gatekeepers are the assessment step: Amaya (overall readiness review of the room), IDI (the seven published investment-readiness pillars), ADI (AI disruption exposure: External Pressure, Internal Resilience, Adaptive Capacity; dimension names inferred) and Clara (the interview, which sorts every statement into Fact / Assertion / Forecast / Commitment and checks it against the deck and the room). The goal of every item below is to show readiness and viability: what we have built, with evidence, and what we are building, with dated milestones. Status codes are the same G / A / R as above.", "Format per item: Item (folder) [RAG] \u2014 Amaya: what the reviewer checks \u00b7 IDI pillar \u00b7 ADI group \u00b7 Clara risk / answer type.", "BUILT, WITH EVIDENCE", "Executive Summary + Key Figures (00) [G] \u2014 Amaya: every figure traceable to a dated source \u00b7 IDI: all pillars (Overview) \u00b7 ADI: \u2014 \u00b7 Clara: Fact; any number that differs from Key Figures is flagged as a contradiction.", "Product Status Note: live vs simulated (02) [A] \u2014 Amaya: is the product real and what is simulated \u00b7 IDI 1 AI-Readiness, 2 Technology & Product \u00b7 ADI: Adaptive Capacity \u00b7 Clara: Fact; never say RAL is 'trained' or 'running'. Needs Louis's sign-off.", "Product demo, Plug, waitlist site (02, links) [A] \u2014 Amaya: live surfaces match the deck \u00b7 IDI 2 Technology & Product \u00b7 ADI: Adaptive Capacity \u00b7 Clara: Fact; Plug clean-up (113 hosts, 0 confirmed slots [KF-21]) and the waitlist copy fix must happen first.", "Defensibility & Moat Memo (03) [G] \u2014 Amaya: moat stated as hypothesis with proof milestones \u00b7 IDI 3 Data & Model Position \u00b7 ADI: External Pressure \u00b7 Clara: Assertion (label as hypothesis).", "Ambassador questionnaires, briefs, Foundations (04) [A] \u2014 Amaya: team and go-to-market capability \u00b7 IDI 4 Team & Org \u00b7 ADI: Internal Resilience \u00b7 Clara: Fact ('3 recruited and profiled, 0 under signed terms' [KF-28]); consent needed before sharing.", "Market Sizing TAM/SAM/SOM (06) [A] \u2014 Amaya: bottom-up, sourced, not summed \u00b7 IDI 6 Market & Commercial \u00b7 ADI: External Pressure \u00b7 Clara: Fact for sourced inputs, Forecast for SOM.", "Competitor Landscape + research (06) [A] \u2014 Amaya: honest substitutes and closest analogues \u00b7 IDI 6 Market & Commercial \u00b7 ADI: External Pressure (substitution, disintermediation) \u00b7 Clara: Assertion + evidence.", "Ambassador cost inputs: travel model, equipment v6 (07) [A] \u2014 Amaya: costs are built bottom-up \u00b7 IDI 7 Capital & Resilience \u00b7 ADI: Internal Resilience (unit economics) \u00b7 Clara: Forecast (estimates, not quotes).", "Supply scouting: Dubai Art Events plan, OMIC contacts (08) [A] \u2014 Amaya: early supply activity \u00b7 IDI 6 Market & Commercial \u00b7 ADI: Internal Resilience (network) \u00b7 Clara: Fact (14 exhibitions planned, 5 contacts [KF-26, KF-27]); plan only, no outcomes yet; redact phone numbers.", "NOT YET FILED (needed to evidence what we say we have)", "Deck v2 with corrections (01) [R] \u2014 Amaya: deck and room agree \u00b7 IDI: all \u00b7 ADI: Adaptive Capacity (RAL wording) \u00b7 Clara: highest contradiction risk (32 open + 13 new).", "Certificate of incorporation, entity note incl. 'Communiverse Middle East / LatAm' (05) [R] \u2014 IDI 5 Legal & Regulatory \u00b7 ADI: Internal Resilience (governance) \u00b7 Clara: Fact [KF-06, KF-67].", "IP assignments + asset register (05) [R] \u2014 IDI 5 Legal, 2 Technology \u00b7 ADI: Internal Resilience (key-person risk; Abel not on team [KF-65]) \u00b7 Clara: Fact / Commitment.", "Artisan consent template, ambassador agreement (05) [R] \u2014 IDI 5 Legal \u00b7 ADI: Internal Resilience (trust) \u00b7 Clara: Fact; backs every 'verified' and 'consent' claim.", "Data inventory + RAL build-status sign-off (02/03) [R] \u2014 IDI 1 AI-Readiness, 3 Data & Model \u00b7 ADI: Adaptive Capacity \u00b7 Clara: Fact.", "Team appendix (bios, FT/PT), advisor list + agreements (04) [R] \u2014 IDI 4 Team & Org \u00b7 ADI: Adaptive Capacity (team AI capability) \u00b7 Clara: Fact [KF-35 to KF-37].", "Survey raw data with one n; conversation log; dated waitlist export (08) [R] \u2014 IDI 6 Market & Commercial \u00b7 ADI: Internal Resilience (demand signal) \u00b7 Clara: Fact; never quote both 50 and 25 [KF-16, KF-19, KF-25].", "Financial model, cap table, SAFE terms, commitment + bank evidence (07) [R] \u2014 IDI 7 Capital & Resilience \u00b7 ADI: Internal Resilience (unit economics) \u00b7 Clara: Forecast (model) and Fact (SAFE) [KF-01 to KF-08].", "WHAT WE ARE BUILDING (roadmap, stated as targets)", "Roadmap and milestones: UAE launch Q1 2027, Colombia hub Q2 2027, two live hubs Q4 2027, regional marketplace betas 2028 [KF-44]; marketplace date conflict s9 vs s15 open [KF-43] \u2014 IDI 7 Capital & Resilience, 6 Market \u00b7 ADI: Adaptive Capacity (velocity) \u00b7 Clara: Commitment; each needs an owner and a measurable proof point.", "RAL agents, verification protocol, booking-to-delivery data \u2014 IDI 1, 3 \u00b7 ADI: Adaptive Capacity \u00b7 Clara: Forecast ('designed to', 'target').", "Language rules for the room (pre-seed): no urgency ('closing soon', 'last allocation'), no 'buy' or offer language, no hype ('revolutionary', 'skip the problems altogether'), no guaranteed or projected returns, no 'break-even' without a filed model. Use 'built' only for things a reviewer can open today; use 'building', 'designed to' or 'target' for everything else. Untraceable claims get UNVERIFIED."], "chkintro": ["Amaya Readiness Checklist (mapped to IDI pillars, RAG)", "INTERNAL \u00b7 15 Oct 2026, 2:45 PM Dubai. G = filed and consistent \u00b7 A = filed but needs a fix or confirmation \u00b7 R = missing. The pillar names are Amaya's published IDI pillars. The ADI dimension names are inferred (Amaya publishes only the three groups). Figures: Key Figures."], "chkadi": ["ADI groups (published): External Pressure (substitution, disintermediation, synthetic content, platform dependency \u2192 Defensibility memo) \u00b7 Internal Resilience (data, network effects, trust, unit economics \u2192 mostly R until the model and agreements exist) \u00b7 Adaptive Capacity (AI in operations, team AI capability, velocity, governance \u2192 Product Status note; RAL is simulation-only).", "Count: G 3 \u00b7 A 12 \u00b7 R 17. Most reds are Haseeb's documents."], "reviewp": ["Deck v2 Review vs Amaya (IDI \u00b7 ADI \u00b7 Clara \u00b7 Key Figures)", "INTERNAL \u00b7 15 Oct 2026, 2:50 PM Dubai \u00b7 Reviewer: Keiffer Japeth's workspace. Deck reviewed: Communiverse Investor Deck v[phone redacted]), a Canva export created 15 Oct 2:33 PM Dubai, 17 pp, 7,263,099 bytes, SHA-256 d2d8afea\u2026b3a0. It was uploaded to 01 unchanged (hash verified). Compared with v1 (2 Oct) by text diff and pixel diff of every page. Figures: Key Figures sheet (CURRENT).", "Verdict: NOT data-room ready (RED)", "v2 changes only two slides: s13 (Team) and s15 (Roadmap). Slides 1\u201312, 14, 16 and 17 are identical to v1, text and pixels. So every P1 numeric and claim contradiction Amaya and Clara will flag is still there: the survey n (50 vs 25), the $650k wording, the use-of-funds bar, RAL \"trained on our own data\", \"3 ambassadors in place\", the 0.5% claim, break-even with no model, and the s9 vs s15 timing. The s13 edits fix the unnamed-advisor problem. They also open new Legal and Team flags: Abel removed, two undocumented 'Communiverse' entities, Casio on the slide, and a new team member with no evidence. s15 adds an unfunded Artisanal Foods line.", "Counts against the 36 Deck Corrections: fixed 0 \u00b7 partly fixed 2 (#26 advisors named; #17 helped by that) \u00b7 OK / no change needed 2 (#24, #28) \u00b7 still open 32 (2 of them now worse: #27, #36) \u00b7 new issues 13 (4 of them P1).", "New numbers in v2: none. No financial, market or traction figure changed. New non-numeric facts: 6 named team members (was 7), 5 named investors/advisors, Artisanal Foods development from Q4 2027 and a pilot in Q3 2028 (KF-63 to KF-72).", "By pillar (IDI) and ADI group", "ADI (groups published, dimensions inferred): External Pressure is unchanged, plus new food regulatory exposure. Internal Resilience is weaker (key-person and IP gap). Adaptive Capacity is unchanged (RAL simulation presented as live).", "Clara contradiction checks (new in v2)", "Abel built the platform (v1, Product Status note) vs not on the team (v2).", "Casio: a client of Communi8 (s13) vs \"clients like Casio\" (1 Oct note) vs \"no paid contracts, LOIs or pipeline\" (s12).", "Alison: running the Colombia hub (s12) vs listed under Investors and Advisors (s13).", "Collectibles 'next' (s9, s15 subtitle) vs Artisanal Foods pilot (s15 body).", "Regional marketplaces live in Q3 2028 and again in Q4 2028.", "Corrections status (36)", "New issues in v2 (13)", "Top fixes before Monday (a v3 pass of about 2 hours in Canva; no new research needed)", "Numbers (s3, s12, s14, s17): one survey n everywhere; s12 \u2192 \"$50k committed \u00b7 $50k soft \u00b7 $650k open of $750k\"; bar \u2192 25 \u00b7 25 \u00b7 19 \u00b7 17 \u00b7 7 \u00b7 7; delete the break-even line unless the model is filed.", "RAL truth pass (s6, s7, s10, s12): \"RAL simulation (scripted)\"; \"designed to learn from our booking-to-delivery data once live\"; \"2\u20134 people per country (target)\".", "Ambassadors (s8, s12): \"3 recruited and profiled; terms pending\"; one pay model; fix Luna, Ammar and Balo per the Corrections list.", "Team and legal (s13): state Abel's status and get his IP assignment; relabel or document 'Communiverse Middle East / LatAm'; add one line that Casio is a Communi8 client, not ours; fix the monogram footnote or file the photo consents.", "Market and roadmap (s2, s4, s9, s15): reword the 0.5% claim; align s9 and s15 (marketplace beta Q1 2028); move Artisanal Foods to 'next round, exploratory' or fund it in s14; resolve the Q3 vs Q4 2028 'live' duplicate.", "If v3 can't be done before Monday, submit v2 with the Key Figures sheet and a one-page errata. Amaya treats a disclosed correction far better than a contradiction it finds itself.", "Pre-seed lens on the v2 verdict (added 15 Oct 2026, 3:15 PM Dubai)", "The verdict (RED) and counts above are unchanged. Re-read at pre-seed, the reviewers are not asking for traction; they are testing whether the claims are honest and evidenced. So the 32 open items matter because most of them present targets as achieved (RAL 'trained' and 'running', '3 ambassadors in place', 'verified people', break-even 'Modelled'), not because the numbers are small.", "Fastest path to AMBER for a pre-seed assessment: (1) relabel RAL as a simulation on s6, s7, s10, s12; (2) one survey n on s3, s12, s17; (3) s12 '$650k open of a $750k round'; (4) s14 bar 25/25/19/17/7/7 and drop break-even until a model is filed; (5) ambassadors 'recruited and profiled, terms pending'; (6) s9 timing aligned to s15; (7) entity labels on s13 explained or removed; (8) Artisanal Foods marked 'exploratory, unfunded'.", "What v2 already does well at this stage: names the advisors (s13) and keeps 'No paid contracts, LOIs or pipeline yet' (s12), which is exactly the candour a pre-seed assessment rewards.", "Sales or hype wording still in v2 to remove: 'we skip the problems new marketplaces face altogether!' (s9), 'The model is ready' (s8), 'RAL agents now run the admin' (s10)."], "missp": ["Missing Items Request: for Haseeb", "INTERNAL \u00b7 15 Oct 2026 \u00b7 From Keiffer Japeth. Amaya scores every conclusion against a dated source document. Without these items, the claims below will be treated as low-confidence assertions. Requested by Sat 17 Oct, 6 PM Dubai, so the room can be assembled on Sunday. Drop the files into the matching subfolder.", "If an item doesn't exist, say so, and we'll mark it \"Not yet available\" in the index. That costs less confidence than a claim with nothing behind it.", "Pre-seed note (added 15 Oct 2026, 3:15 PM Dubai)", "At pre-seed, the fund's gatekeepers (Amaya: IDI, ADI, Clara) are assessing readiness, not buying. They do not expect revenue; they expect every statement to be backed or honestly labelled. For each item above, 'not yet available' is an acceptable answer if we say so and give the date or milestone when it will exist. Grouping:", "Evidence for what we have built: 5 incorporation, 6 IP and asset register, 7 survey raw data, 8 conversation log, 9 advisor list, 10 team appendix, 11 RAL build-status sign-off.", "Evidence for the capital plan: 1 financial model, 2 cap table, 3 SAFE, 4 soft $50k status.", "What we are building (agreements and decisions that unlock the roadmap): 12 ambassador pay, 13 LatAm terms, 14 consent and ambassador templates, 15 decisions, 16 corrected deck.", "New since deck v2 (also needed): Abel Thomas IP assignment [KF-65], 'Communiverse Middle East / LatAm' entity documents [KF-67], Artisanal Foods funding or 'exploratory' label, Hira E. Silsby bio, advisor letters and photo consent."], "clarap": ["Clara Interview Prep: 20 Q&A (Haseeb + Keiffer)", "INTERNAL \u00b7 15 Oct 2026. Clara sorts every statement into Fact / Assertion / Forecast / Commitment and flags contradictions with the deck, the data room and the live sites. Use only figures in the Key Figures sheet. Never round in our favour, and say \"we don't know yet\" when that's true.", "Phrases that will be tagged: \"trained on our own data\" \u00b7 \"3 ambassadors in place\" \u00b7 \"signed and verified makers\" \u00b7 \"Casio is a client\" \u00b7 \"we skip the problems ... altogether\" \u00b7 \"no competitor sells bookable time with artists\" \u00b7 \"break-even\" without a model \u00b7 \"66+ countries\" without a source.", "Rehearsal: 60\u201390 minutes on Sunday 18 Oct. Haseeb answers first; Keiffer covers 5, 8, 9, 11, 13, 14 and 18.", "Pre-seed framing (added 15 Oct 2026, 3:15 PM Dubai)", "Clara is an assessment, not a sales meeting. Don't pitch, don't create urgency, and never promise returns or a close date. Lead every answer with what is built and evidenced, then what we are building and the milestone that proves it.", "21. 'Why invest now?' \u2192 \"We're at pre-seed. Here is what we've built: a live demo, a waitlist site, a booking flow, three profiled ambassadors and a scouting pipeline. Here is what this round funds: two hubs and the first verified artisans, with UAE launch targeted for Q1 2027.\" Type: Fact + Commitment [KF-28, KF-44].", "22. 'What returns do you expect?' \u2192 \"We won't quote returns. The financial model is being finalised; we'll share modelled cases, labelled as such.\" Type: Forecast [KF-07].", "23. 'What would make you not ready?' \u2192 Name the gaps ourselves: no signed artisans, RAL not built, model and legal documents pending. Type: Fact [KF-20, KF-38].", "Team answer update (deck v2): Abel Thomas is not on the team; don't credit him with current work. Q15 answer depends on IP assignments being filed (UNVERIFIED until then) [KF-65]. Q14 answer is only true after the Plug clean-up is done and checked."], "fixp": ["Deck Corrections for Haseeb: Deck v1 (2 Oct 2026) \u2192 v2", "INTERNAL \u00b7 15 Oct 2026 \u00b7 Prepared for Haseeb Wasim by Keiffer Japeth. Each fix ties to the Key Figures sheet. Priority: P1 = Clara will flag it as a contradiction \u00b7 P2 = an unsupported claim \u00b7 P3 = polish.", "Export note. The 2 Oct deck in My Drive (id 1rctEkK9\u2026) is 0 bytes. Only the 6.9 MB copy in Communiverse (now copied into 01) is valid. Export v2 as PDF and file it in 01 as \"v2 (date) - CURRENT\". Rename v1 \"SUPERSEDED\" at that point; Keiffer does this manually.", "Pre-seed framing for the deck (added 15 Oct 2026, 3:15 PM Dubai)", "The deck goes to the fund's assessment step (Amaya: IDI, ADI, Clara), not to a buyer. It should read as a readiness file, not a pitch. These rules sit on top of the 36 corrections above; none of the approved fixes change.", "1. Split every claim into 'Built (evidence)' or 'Building (target)'. Suggested slide labels: s6 'Built today', s9/s15 'Building: roadmap targets', s12 'Evidence to date'.", "2. Only call something built or live if a reviewer can open it today or it has arts in Dubai/UAE (demand) and Colombia (supply, selling to US buyers), and grows city by city through local ambassadors."}, {"p": "Context (sourced). People place 62% less value on art once it's labelled AI-made [KF-60]. 82% of Colombian craft households earn below minimum wage [KF-59]. Dubai had 18.72m international visitors in 2024 [KF-50], and 66% of them visited cultural or heritage sites [KF-51]."}, {"p": "What we have built (with evidence) and what is not yet in place."}, {"t": [["", "Status", "KF"], ["Product", "Waitlist site live. Interactive demo live (sample data). Artist directory and booking flow live, with 0 confirmed slots", "KF-21, KF-22"], ["RAL (AI operating layer)", "Scripted simulation in the demo, not in production. Production AI today = third-party search and drafting", "KF-38, KF-41"], ["Supply", "0 artisans under formal agreement. 100+ artist conversations in 7 countries (log pending). 14 Dubai exhibitions in the scouting plan; 5 OMIC contacts", "KF-19, KF-20, KF-26, KF-27"], ["Ambassadors", "3 recruited and profiled (Luna, Ammar, Balo); terms pending", "KF-28, KF-29"], ["Demand evidence", "Buyer survey (n to be confirmed: 50 or 25); waitlist count pending", "KF-16, KF-25"], ["Revenue / contracts", "None. No paid contracts or LOIs", "KF-23, KF-24"]]}, {"p": "Capital plan (for assessment). Proposed pre-seed round of US$750,000 on a YC SAFE (cap and discount pending), issued by Common Folk Group, Inc. (Delaware). $50k legally committed and $50k soft (both UNVERIFIED until the signed SAFE and bank evidence are filed), $650k open [KF-01 to KF-05]. 24 months of runway, Jan 2027 to Dec 2028 (model pending) [KF-07]. Use of funds: hubs $375k (UAE $185k, Colombia $190k) \u00b7 platform $270k (product and RAL $140k, ambassador engine $130k) \u00b7 foundation $105k (legal/IP $55k, finance/contingency $50k) [KF-09 to KF-15]."}, {"p": "Market context (bottom-up, sourced). Dubai: ~12.36m culturally engaged visitors a year (calc) and 4.58m residents. A comparable public craft session costs about US$57\u201360 [KF-50 to KF-52, KF-56]. Next layers: the UAE (11.29m residents) and the GCC (72.2m international arrivals) [KF-53, KF-54]. Global handicrafts (US$986.9bn) is context only, not a TAM claim [KF-45]. Our own SOM is not yet sized (needs the financial model)."}, {"p": "What we are building: roadmap targets (deck s15; targets, not achieved results). UAE launch Q1 2027 \u00b7 Colombia hub Q2 2027 \u00b7 two live hubs Q4 2027 \u00b7 regional marketplace betas 2028 [KF-44]. The marketplace start date is being aligned [KF-43]."}, {"p": "Team (per deck v2 s13). Haseeb Wasim (Founder & CEO) \u00b7 Elferah Saidil (Operations) \u00b7 Louis Mitchell (RAL) \u00b7 Keiffer Japeth (Head of GTM and Ambassador Programme; deck title differs [KF-36]) \u00b7 Hassan B. Mirza (Brand and Design) \u00b7 Hira E. Silsby (new in v2; bio UNVERIFIED) [KF-35]. Alison Gonzalez is listed under Investors and Advisors in v2; her role is to be confirmed [KF-37]. Abel Thomas is not on the team (he did not join); platform IP ownership is a GAP [KF-65]. Advisor agreements and FT/PT status are pending [KF-37]."}, {"p": "Key risks we're working on. Unproven supply moat (no signed artisans) \u00b7 RAL not yet built \u00b7 no financial model in the room yet \u00b7 disintermediation by experience platforms. See the Defensibility & Moat memo and the Product Status note."}]}</script>

function pill(t){if(!t)return'';const u=t.toUpperCase();let c='pn';

 if(/UNVERIFIED/.test(u))c='uv';return`<span class="pill ${c}">${esc(t.length>34?t.slice(0,32)+'…':t)}</span>`}
const UV='<span class="pill uv">UNVERIFIED</span>';

function dl(h,r){return'<dl>'+h.map((k,i)=>r[i]?`<dt>${esc(k)}</dt><dd>${esc(r[i])}</dd>`:'').join('')+'</dl>'}

function blocks(B){return'<div class="doc">'+B.map(b=>b.p!=null?`<p>${esc(b.p)}</p>`:b.h?`<h5>${esc(b.h)}</h5>`:tbl(b.t)).join('')+'</div>'}

`<h2>Unverified figures <span class="note">${unv.length}</span></h2>`+unv.map(r=>card(`${r[0]} · ${esc(r[2])}`,esc(r[3]),UV,`<p>Source: ${esc(r[5])}<br>Action: ${esc(r[7])}</p><div class="detail">${dl(D.kfh,r)}</div>`)).join('')+
`<h2>Red checklist items <span class="note">${chR.length}</span></h2>`+chR.map(r=>card(esc(r[1]),`${esc(r[0])} · folder ${esc(r[2])} · ${esc(r[3])}`,pill('R'),esc(r[5]||'—'))).join(''));

$('#nav').innerHTML=`<div class="brand"><b>Communiverse</b><span>Pre-seed data room · assessment readiness</span></div>`+groupsN.map(g=>`<h6>${g}</h6>`+V.filter(v=>v.group==g).map(v=>`<a href="#${v.id}" data-v="${v.id}">${esc(v.label)}<i>${v.count}</i></a>`).join('')).join('');
$('#tabbar').innerHTML=V.map(v=>`<a href="#${v.id}" data-v="${v.id}">${esc(v.label.replace('Data room folders',''))}</a>`).join('');
$('#views').innerHTML=V.map(v=>`<section class="view" id="v-${v.id}">${v.html}</section>`).join('');
function go(){const id=(location.hash||'#overview').slice(1);document.querySelectorAll('section.view').forEach(s=>s.classList.toggle('on',s.id=='v-'+id));
 document.querySelectorAll('[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v==id));const t=document.querySelector('.tabbar a.on');t&&t.scrollIntoView({inline:'center',block:'nearest'});scrollTo({top:0})}
addEventListener('hashchange',go);go();
document.addEventListener('click',e=>{const h=e.target.closest('.ch');if(h)h.parentElement.classList.toggle('open')});
function filt(box,attr){const f=$(box);if(!f)return;f.onclick=e=>{const b=e.target.closest('button');if(!b)return;f.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));const v=b.dataset[attr];f.parentElement.querySelectorAll(`div[data-${attr=='a'?'area':attr}]`).forEach(d=>d.classList.toggle('hide',!!v&&d.dataset[attr=='a'?'area':attr]!=v))}}
filt('#kff','a');filt('#fxf','p');filt('#ckf','r');
const setM=p=>{document.body.classList.toggle('plain',p);$('#mP').classList.toggle('on',p);$('#mD').classList.toggle('on',!p)};$('#mP').onclick=()=>setM(true);$('#mD').onclick=()=>setM(false);
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{const q=e.target.value.trim().toLowerCase();document.body.classList.toggle('searching',!!q);
 document.querySelectorAll('section.view').forEach(s=>{let any=false;s.querySelectorAll('.card').forEach(c=>{const m=!q||c.textContent.toLowerCase().includes(q);c.classList.toggle('hide',!m);if(q&&m){any=true;if(c.querySelector('.cbi').textContent.toLowerCase().includes(q)&&!c.querySelector('.ch').textContent.toLowerCase().includes(q))c.classList.add('open')}});
  s.querySelectorAll('.lead,.panel,.grid,.verdict,h2,.filters,.empty,.note').forEach(x=>x.classList.toggle('hide',!!q));if(q){setM(false);s.classList.toggle('hide',!any)}else s.classList.remove('hide')})},180)};
</script></body></html>
