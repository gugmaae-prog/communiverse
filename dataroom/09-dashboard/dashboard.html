uched."}, {"p": "Version log"}, {"p": "v1 \u00b7 15 Oct 2026: room created; 11 Drive files copied, 5 source files uploaded as new copies; 10 documents and 1 sheet written."}, {"p": "Update v2 \u00b7 15 Oct 2026, 2:50 PM Dubai (deck v2 received)"}, {"p": "01: Communiverse Investor Deck v[phone redacted]) added unchanged (7,263,099 bytes; SHA-256 d2d8afea\u2026b3a0, verified after upload). The data-room v1 copy was renamed SUPERSEDED (the original in Communiverse is untouched)."}, {"p": "00: The Key Figures CURRENT sheet adds v2 value, changed?, and status after v2 columns to every row, plus KF-63 to KF-72. The original sheet is kept unchanged as 'Key Figures - v1 history'. All KF IDs are unchanged, so earlier citations remain valid."}, {"p": "99: Deck v2 Review vs Amaya. Verdict: RED, not data-room ready. 0 fixed \u00b7 2 partly \u00b7 2 no change needed \u00b7 32 open \u00b7 13 new issues (4 P1)."}, {"p": "Open items added for Haseeb: Abel Thomas status and IP assignment; 'Communiverse Middle East / LatAm' entity documents; Artisanal Foods funding or deferral; Hira E. Silsby bio; advisor letters and photo consent."}, {"p": "Version log: v2 \u00b7 15 Oct 2026, 2:50 PM Dubai: deck v2 filed and reviewed; Key Figures CURRENT created; index updated."}, {"p": "Update v3 \u00b7 15 Oct 2026, 3:15 PM Dubai: pre-seed framing"}, {"p": "Purpose. Communiverse is at pre-seed. This room is for assessment, not a sale: Amaya and the fund's gatekeepers (IDI pillars, ADI, Clara interview) test readiness and viability. Every file is read as either 'what we have built' (must be openable or evidenced today) or 'what we are building' (roadmap targets with owners and proof milestones). Folder numbers and file locations are unchanged; nothing was moved or deleted."}, {"p": "Reading guide: what we have built (evidence)"}, {"p": "Product and AI: Product Status Note (02), demo, Plug and waitlist links (02). Evidence: public checks 15 Oct; RAL is a scripted simulation [KF-38]."}, {"p": "Supply 00b7 15 Oct 2026, updated 15 Oct (pre-seed framing) \u00b7 This is a readiness summary, not an offer or a sales document: it separates what we have built (with evidence) from what we are building (roadmap targets). Every figure is traceable in the Key Figures sheet (CURRENT, 1g6tSJ8c\u2026) [KF-xx]; anything without a source is tagged UNVERIFIED."}, {"p": "What we are building. A marketplace designed around verified artisans (verification protocol not yet written; 0 artisans verified or signed today [KF-20]). Each artisan earns through five lines from one relationship: workshops and experiences, corporate programmes, commissions and brand collaborations, kits and gifts, and regional marketplace sales. Artisans never pay to join (deck s9). It starts in Dubai/UAE (demand) and Colombia (supply, selling to US buyers), and grows city by city through local ambassadors."}, {"p": "Context (sourced). People place 62% less value on art once it's labelled AI-made [KF-60]. 82% of Colombian craft households earn below minimum wage [KF-59]. Dubai had 18.72m international visitors in 2024 [KF-50], and 66% of them visited cultural or heritage sites [KF-51]."}, {"p": "What we have built (with evidence) and what is not yet in place."}, {"t": [["", "Status", "KF"], ["Product", "Waitlist site live. Interactive demo live (sample data). Artist directory and booking flow live, with 0 confirmed slots", "KF-21, KF-22"], ["RAL (AI operating layer)", "Scripted simulation in the demo, not in production. Production AI today = third-party search and drafting", "KF-38, KF-41"], ["Supply", "0 artisans under formal agreement. 100+ artist conversations in 7 countries (log pending). 14 Dubai exhibitions in the scouting plan; 5 OMIC contacts", "KF-19, KF-20, KF-26, KF-27"], ["Ambassadors", "3 recruited and profiled (Luna, Ammar, Balo); terms pending", "KF-28, KF-29"], ["Demand evidence", "Buyer survey (n to be confirmed: 50 or 25); waitlist count pending", "KF-16, KF-25"], ["Revenue / contracts", "None. No paid contracts or LOIs", "KF-23, KF-24"]]}, {"p": "Capital plan (for assessment). Proposed pre-seed round of US$750,000 on a YC SAFE (cap and discount pending), issued by Common Folk Group, Inc. (Delaware). $50k legally committed and $50k soft (both UNVERIFIED until the signed SAFE and bank evidence are filed), $650k open [KF-01 to KF-05]. 24 months of runway, Jan 2027 to Dec 2028 (model pending) [KF-07]. Use of funds: hubs $375k (UAE $185k, Colombia $190k) \u00b7 platform $270k (product and RAL $140k, ambassador engine $130k) \u00b7 foundation $105k (legal/IP $55k, finance/contingency $50k) [KF-09 to KF-15]."}, {"p": "Market context (bottom-up, sourced). Dubai: ~12.36m culturally engaged visitors a year (calc) and 4.58m residents. A comparable public craft session costs about US$57\u201360 [KF-50 to KF-52, KF-56]. Next layers: the UAE (11.29m residents) and the GCC (72.2m international arrivals) [KF-53, KF-54]. Global handicrafts (US$986.9bn) is context only, not a TAM claim [KF-45]. Our own SOM is not yet sized (needs the financial model)."}, {"p": "What we are building: roadmap targets (deck s15; targets, not achieved results). UAE launch Q1 2027 \u00b7 Colombia hub Q2 2027 \u00b7 two live hubs Q4 2027 \u00b7 regional marketplace betas 2028 [KF-44]. The marketplace start date is being aligned [KF-43]."}, {"p": "Team (per deck v2 s13). Haseeb Wasim (Founder & CEO) \u00b7 Elferah Saidil (Operations) \u00b7 Louis Mitchell (RAL) \u00b7 Keiffer Japeth (Head of GTM and Ambassador Programme; deck title differs [KF-36]) \u00b7 Hassan B. Mirza (Brand and Design) \u00b7 Hira E. Silsby (new in v2; bio UNVERIFIED) [KF-35]. Alison Gonzalez is listed under Investors and Advisors in v2; her role is to be confirmed [KF-37]. Abel Thomas is not on the team (he did not join); platform IP ownership is a GAP [KF-65]. Advisor agreements and FT/PT status are pending [KF-37]."}, {"p": "Key risks we're working on. Unproven supply moat (no signed artisans) \u00b7 RAL not yet built \u00b7 no financial model in the room yet \u00b7 disintermediation by experience platforms. See the Defensibility & Moat memo and the Product Status note."}], "size": 10109}, "d2": {"name": "Key Figures - single source of truth (CURRENT, incl. deck v2 15 Oct).xlsx", "sec": "00 Index & Overview", "ext": "xlsx", "blocks": [{"h": "Sheet: Untitled"}, {"t": [["ID", "Area / IDI pillar", "Metric", "Canonical value (use this)", "Status", "Primary source (doc, location, date)", "Conflicting values found (where)", "Action / owner", "v2 deck (15 Oct) value", "Changed in v2?", "Status after v2 (15 Oct)"], ["KF-01", "Capital", "Raise target", "US$750,000", "Consistent except s12", "Deck v[phone redacted] Company & Deck) s1, s14", "s12: '$50k committed, $50k soft agreement, toward $650k' reads as a $650k target", "Haseeb: fix s12 wording", "s1, s14 $750k; s12 still 'toward $650k'", "No", "CONFLICT persists (s12)"], ["KF-02", "Capital", "Legally committed", "US$50,000", "Unverified (no evidence filed)", "Deck v[phone redacted] Company & Deck) s14", "-", "Haseeb: upload signed SAFE / commitment", "Unchanged", "No", "As before"], ["KF-03", "Capital", "Soft agreement", "US$50,000 (pending bank-account setup)", "Unverified", "Deck v[phone redacted] Company & Deck) s14; 1 Oct meeting summary as quoted in 'Communiverse: everything we know' brief (7 Oct) \u00a73", "-", "Haseeb: bank account confirmation + expected close date", "Unchanged", "No", "As before"], ["KF-04", "Capital", "Open / remaining", "US$650,000", "Calc (750-50-50)", "Deck v[phone redacted] Company & Deck) s14", "-", "-", "Unchanged", "No", "As before"], ["KF-05", "Capital", "Instrument / terms", "YC SAFE; valuation cap and discount: GAP", "GAP", "Deck v[phone redacted] Company & Deck) s1, s14", "No cap or discount stated in any file", "Haseeb: SAFE terms", "Unchanged", "No", "As before"], ["KF-06", "Legal", "Issuer", "Common Folk Group, Inc., Delaware C-corporation", "Unverified (no certificate filed)", "Deck v[phone reda Every figure, and where it comes from."}, {"p": "FIGURE SOURCE SLIDES"}, {"p": "62% less value for AI-labelled art Columbia Business School, research brief on human-made vs AI art (2026) 2, 10"}, {"p": "Etsy allows third-party-produced designs and seller-prompted AI art Etsy, Creativity Standards (July 2024, updated June 2025) 2"}, {"p": "AI supply crowds out human artists Goldberg and Lam, Stanford Graduate School of Business (2025) 2, 10"}, {"p": "82% of craft-income households below minimum wage DANE Orange Economy report using SIEAA artisan data (2021), reported by M\u00e1s Colombia 2, 10"}, {"p": "100+ artists and artisans, 7 countries; 25-person buyer survey Communiverse founder-led conversations at events and buyer survey (2026). Notes in the data room 3, 10, 12"}, {"p": "$986.9bn handicrafts market (2025); no player above 0.5% IMARC Group, Handicrafts Market Report (2025). Other estimates run lower, from $740bn (Grand View Research) 2, 4"}, {"p": "$271bn experiences market (2025); 33% booked online Arival and Phocuswright, The Outlook for Travel Experiences 2019 to [phone redacted]"}, {"p": "$59.6bn global art market (2025) Art Basel and UBS, Global Art Market Report (2026) 4"}, {"p": "18.72m Dubai visitors (2024); 66% visited cultural or heritage sites Dubai Department of Economy and Tourism, Annual Visitor Report 2024 4"}, {"p": "Creative industries at 5% of UAE GDP by 2031 UAE National Strategy for the Cultural and Creative Industries (2021), u.ae 4, 10"}, {"p": "Saudi Year of Handicrafts 2025 Saudi Ministry of Culture; approved by the Council of Ministers, September 2024 4, 10"}, {"p": "~350,000 Colombian artisans; 15% of manufacturing jobs ProColombia and Artesan\u00edas de Colombia, reported by Portafolio 4"}, {"p": "$6.5m craft exports (2023); US the largest buyer DANE and ProColombia, reported by Forbes Colombia (2024). $19 per artisan is our calculation 4, 10, 14"}, {"p": "Company status, demos, financing Communiverse and Common Folk Group internal records, as of deck date 12, 14"}, {"p": "No figure in this deck is a Communiverse forecast unless marked modelled. Links are in the speaker notes and the data room."}, {"p": "C O M M U N I V E R S E | P R E - S E E D | C O N F I D E N T I A L 1 7"}], "size": 6896891}, "d6": {"name": "Product Status Note - live vs simulated (RAL).docx", "sec": "02 Product & Technology", "ext": "docx", "blocks": [{"p": "Communiverse: Product Status Note (what's live vs simulated)"}, {"p": "Version 1 \u00b7 15 Oct 2026 \u00b7 Owner: Keiffer Japeth, with Abel Thomas and Louis Mitchell to confirm. Status from public checks on 15 Oct 2026 and the internal audit of 9 Oct 2026. Figures: Key Figures."}, {"p": "Bottom line. Communiverse has a live waitlist site, an interactive product demo and a live artist directory with a booking flow. There are no transactions, no confirmed bookable slots and no signed artisans [KF-20, KF-21, KF-24]. RAL, the Regional Agentic Layer, is a scripted simulation inside the demo. It does not run operations today [KF-38]."}, {"t": [["Surface", "URL", "Status", "What's real", "What's simulated or not built"], ["Marketing site and waitlist", "communiverseclubs.com", "Live (Framer)", "Waitlist capture (count GAP [KF-25])", "Copy is out of date (\"Club That Runs Itself\", \"signed and verified, one per craft\") and conflicts with the deck [KF-20]; fix pending"], ["Product demo", "communiversedemo.xyz", "Live", "Buyer journeys (Learn / Make / Collect / Belong), artisan onboarding (6 steps), ambassador flow", "All data is sample data. 16 demo artisans [KF-22]. Colombia and Italy are disabled"], ["RAL (inside the demo)", "communiversedemo.xyz", "Live demo", "The operating-model design: supply, demand, delivery and back-office agents; human decision points (s7)", "Scripted: \"a simulated clock runs a working day\", \"10 scripted Moments\", \"illustrative 12% take\". Agent counts are inconsistent (24 / 27 / 26) [KF-39]. The Economics tab (AED 72,600 a month per country) is illustrative and not aligned with use of funds [KF-42]"], ["Plug: artist directory and booking", "espacios.me/communiverse", "Live (hosted on Keiffer's Cloudflare account)", "Artist profiles, booking flow; AI search and drafts (Groq API) [KF-41]", "113 hosts listed, including deceased and unconsented artists from public gallery listings, with 0 confirmed slots [KF-21]. Circles (community) are empty. Clean-up is due before Monday"], ["Payments / checkout", "\u2014", "Not built", "\u2014", "Marketplace checkout is on the roadmap (s9 / s15) [KF-43]"], ["Mobile app", "\u2014", "Concept only", "\u2014", "\u2014"]]}, {"p": "AI position (for IDI AI-Readiness / Data & Model Position)"}, {"p": "In production: third-party LLM calls for search and drafting on Plug [KF-41]. There are no proprietary models."}, {"p": "Designed, not built: RAL agents. The deck's \"Trained on our own booking-to-delivery data\" (s7) can't be true yet, because there are no bookings. Correct wording: \"Designed to learn from our booking-to-delivery data once live.\""}, {"p": "Human decisions by design: artisan selection, storytelling, pricing, payouts, refunds and safety (s7)."}, {"p": "Data captured today: the waitlist and onboarding records in the prototype database. A data inventory and consent records are GAP."}, {"p": "Ownership and hosting (for Legal & Regulatory)"}, {"p": "The Plug site runs on espacios.me in Keiffer's Cloudflare account. The deck credits Abel Thomas with the platform and demo (s13). The asset register (domains, Cloudflare, repos, Canva) and IP assignments to Common Folk Group, Inc. are GAP (see Missing Items)."}, {"p": "Not yet available"}, {"p": "Prototype video, UX walkthrough videos, architecture diagram, RAL build-status sign-off (Louis)."}, {"p": "Pre-seed framing and v2 update (added 15 Oct 2026, 3:15 PM Dubai)"}, {"p": "Built today (evidence: public checks 15 Oct): waitlist site, product demo with sample data, RAL as a scripted simulation, Plug directory and booking flow [KF-21, KF-22, KF-38, KF-41]. Building: RAL agents, payments and checkout, mobile app, verification protocol, data inventory [KF-38, KF-43]. Team change from deck v2: Abel Thomas is not on the team (he did not join), so the credit to Abel above (s13, v1) is historical; who built and owns the platform and demo code is UNVERIFIED until the asset register and IP assignments are filed [KF-65]. Sign-off is now needed from Louis Mitchell only. Figures cite the v1 Key Figures link; IDs are unchanged in Key Figures CURRENT (1g6tSJ8c\u2026), which governs."}], "size": 10725}, "d7": {"name": "Defensibility & Moat Memo.docx", "sec": "03 Data & AI Position", "ext": "docx", "blocks": [{"p": "Communiverse: Defensibility & Moat Memo"}, {"p": "Version 1 \u00b7 15 Oct 2026 \u00b7 Owner: Keiffer Japeth. Figures are cited to the Key Figures sheet as [KF-xx]. Each moat is stated as a hypothesis, with the evidence that exists today and the milestone that would prove it."}, {"p": "Position in one line"}, {"p": "Communiverse is pre-launch. Its moat is not yet built. The thesis is that a verified, consented and continuing relationship with each artisan earns across five revenue lines, and that this compounds in a way that listing and booking platforms can't copy cheaply. Today the evidence is the design, the demo and the early supply scouting. There are no signed artisans and no transactions [KF-20, KF-23, KF-24]."}, {"p": "Moat hypotheses"}, {"t": [["#", "Hypothesis", "Deck claim", "Evidence today", "Proof milestone (owner sets the date)", "Closest comparable"], ["1", "Verification is the product. Buyers pay a premium for proven human-made work", "s5 \"identity \u00b7 craft \u00b7 story \u00b7 quality \u00b7 consent\"; s2 62% value drop for AI-labelled art [KF-60]", "6-step onboarding exists in the demo [KF-22]. No written protocol. Live Plug lists 113 hosts with no consent records [KF-21]", "Written verification protocol; first N verified and consented artisans (GAP)", "Saatchi Art: 3-work portfolio, ID check, curators. Etsy: Star Seller"], ["2", "One relationship, five revenue lines raises revenue per artisan", "s9", "Model only. No revenue [KF-24]. Take rate GAP [KF-61]", "First paid booking; revenue per artisan by line", "Etsy grew mainly through take rate (17.1% in 2020 \u2192 24.2% in FY2025, per the competitor file)"], ["3", "Ambassador-led local supply lowers acquisition cost and builds density", "s8", "3 ambassadors recruited and profiled, 0 signed [KF-28]. Pay model pending [KF-29]. Travel costs modelled [KF-31]. Supply scouting: 14 Dubai exhibitions planned [KF-26], 5 OMIC contacts [KF-27]", "Signed ambassador terms; cost per signed artisan (a Foundations scorecard metric)", "Masterworks (sponsor-only membership); Etsy Insider"], ["4", "Bookable artist time is the wedge", "s6, Plug", "Booking flow is live, with 0 confirmed slots [KF-21]", "Confirmed slots; sessions booked; rebook rate; session-to-artwork conversion", "Airbnb Experiences, ClassPass, Fever (bookable, but no artisan verification or ongoing relationship)"], ["5", "RAL operating leverage: 2\u20134 people per country", "s7, s10", "Scripted simulation, not in production [KF-38, KF-40]. Agent counts conflict [KF-39]", "Live agent list; hours saved; people per hub measured in the UAE in 2027", "\u2014"], ["6", "Content flywheel: every session makes content that points to a bookable artisan", "s8", "Ambassador content standards and kit defined (Foundations; [KF-30])", "Content-to-booking attribution", "Artsy's editorial-to-transaction path"]]}, {"p": "Threats (ADI External Pressure, dimensions inferred)"}, {"p": "Disintermediation. Etsy, Airbnb Experiences or AI booking agents could list the same artisans. Mitigation (hypothesis): verification, consent and multi-line earnings make the relationship stickier than a single listing. This is unproven until artisans are retained and earning on several lines."}, {"p": "Synthetic-content flood. Mitigation: in-person verification and provenance records (provenance is planned for the US marketplace beta, Q2 2028, per s15)."}, {"p": "Platform dependency. Distribution relies on Instagram, TikTok and YouTube (s11; ambassador audiences [KF-32 to KF-34])."}, {"p": "Thin supply moat today. \"A verified supply network rivals would have to rebuild city by city\" (s11) is a target, not a current asset [KF-20]."}, {"p": "What makes this defensible later (and how Amaya can check it)"}, {"p": "Verified and consented artisans per city, with retention (needs a protocol and a CRM)."}, {"p": "Revenue lines per artisan, and revenue per artisan over time (needs the model and transactions)."}, {"p": "Cost per signed artisan through ambassadors vs paid acquisition (Foundations scorecard)."}, {"p": "A proprietary data asset: verification records, bookings and content rights, owned by Common Folk Group, Inc. (IP assignment is GAP; see 05 Legal & Regulatory)."}, {"p": "Pre-seed framing (added 15 Oct 2026, 3:15 PM Dubai)"}, {"p": "For the fund's assessment (IDI 3 Data & Model Position; ADI External Pressure and Internal Resilience). Built today, with evidence: the operating design and demo onboarding [KF-22], 3 ambassadors recruited and profiled [KF-28], supply scouting plan and contacts [KF-26, KF-27], ambassador content standards [KF-30]. Building: every moat in the table above; each is a hypothesis until its proof milestone is met, and none should be described as an existing advantage. Owners still need to set the dates for the proof milestones (GAP). Figures cite the v1 Key Figures link; IDs are unchanged in Key Figures CURRENT (1g6tSJ8c\u2026), which governs. Note: hypothesis 2 cites Etsy take rates from the competitor research file, not a KF ID (source: Competitor Feature Rollouts, 06)."}], "size": 11524}, "d8": {"name": "Ambassador Programme Foundations (Keiffer, 2026-10-01).docx", "sec": "04 Team & Org", "ext": "docx", "blocks": [{"p": "Ambassador Programme: Foundations"}, {"p": "Keiffer Japeth / Marketing, GTM and Ambassador Programme LeadFor Haseeb Wasim / Elferah Saidal1 October 2026"}, {"p": "These are the foundations needed to build the Communiverse ambassador programme from the ground up. Each item has a short description of what it is and why it is needed. Amounts are in AED. Items marked pending depend on team decisions."}, {"p": "Section 1: Business foundations"}, {"p": "1. Programme framework and scorecard"}, {"p": "The rules of the programme: roles, the ambassador journey from recruitment to onboarding to reviews, and the scorecard. Month-one scorecard measures: engagement / artisans signed / footage on time and to standard / cost per signed artisan (raw and market-adjusted) / profitability and fairness test. Underperformance follows a performance improvement plan with SMART goals, 30-day tracking and sandwich-style coaching."}, {"p": "2. Pay and incentive model"}, {"p": "Currently sales-based only: about 551 AED per signed and verified artisan, with no salary, retainer or fixed fee. Travel and support are case by case and specific. Regional SPV shares are under consideration, not confirmed. Compensation is internal and not disclosed to artisans. Pending team confirmation after the team discussion."}, {"p": "3. Artisan consent and agreement templates"}, {"p": "A signed consent or a simple written artisan agreement, covering consent to film and share, fair credit, and what happens to the content. This protects the artisans and the brand, and it is the base for the no-exploitation rule. Needs a review for the UAE and Colombia."}, {"p": "4. Brand style guide with samples"}, {"p": "Communiverse's brand guidelines for ambassador content, with sample posts and clips of what good looks like (authentic / organic / honest, subtle on camera, focused on how things are made). Includes a one-page reference card for every ambassador."}, {"p": "5. Recruitment plan per city"}, {"p": "Start with warm intros from Luna and Hassan, post in artisan workshops, run one open call per city with a one-minute video prompt, and visit workshops first before mock-ups once there is a shortlist. For new cities, study the output from current ambassadors first, then apply the learnings. Still needed: a target list of cities and a shortlist process."}, {"p": "6. Budget and cost model"}, {"p": "The travel package model for the UAE and Colombia first, with India and Egypt prepared: flights by season, modest hotels at local rates, transport, groceries and per-trip totals. Standard kit about 1,468 AED per ambassador (DJI Osmo Nano plus tripod). Sales-based pay of 551 AED per signed artisan. Still needed: a cap per trip and who books travel."}, {"p": "7. Reporting cadence to Haseeb and Elferah"}, {"p": "A fixed rhythm for updates, for example a short weekly update to Elferah on deadlines and a monthly review with Elferah and Haseeb on the scorecard, spend and decisions. Haseeb approves pay, agreements and the onboarding process. The exact cadence is to be agreed."}, {"p": "8. Legal and compliance basics for UAE and Colombia"}, {"p": "Check with a local adviser before scaling: how ambassadors are engaged (contractor or not, with no salary), consent and image rights for artisans, data protection and privacy for recordings, advertising and endorsement disclosure rules, and rules on filming in each place. Also confirm how the artisan-facing wording fits the consent and fair credit commitment. This list is a starting point for an adviser, not legal advice."}, {"p": "Section 2: Technical foundations"}, {"p": "1. CRM"}, {"p": "Tracks artisans, ambassadors and content in one place, and measures timely delivery. monday.com is one option from the top of my head, but a more custom setup is preferred. The team will decide which CRM is best."}, {"p": "2. Content management"}, {"p": "A shared home for the style guide, reference cards and approved sample content, with version control so ambassadors always use the current version."}, {"p": "3. Dashboard"}, {"p": "Automates the scorecard metrics and flags underperformance, for example when the 30-day tracking falls behind. It pulls from the CRM and analytics."}, {"p": "4. Consent and agreement storage"}, {"p": "Secure storage for signed consents and artisan agreements, linked to each artisan and ambassador record, with retrieval when asked."}, {"p": "5. Communication channels"}, {"p": "A community chat for ambassadors, for announcements / questions / sharing wins / the monthly showcase. Plus one place for updates to Haseeb and Elferah."}, {"p": "6. Basic analytics"}, {"p": "Reach / engagement / bookings / sales, per ambassador and per city, so the cost per signed artisan and the profitability and fairness test can be calculated."}, {"p": "Suggested order of work"}, {"p": "First: pay model decision / consent and agreement templates / brand style guide and reference card / CRM choice."}, {"p": "Next: scorecard and dashboard / reporting cadence / recruitment per city."}, {"p": "Then: legal check for the UAE and Colombia before the first ambassador is onboarded, and analytics and community chat set up in parallel."}], "size": 197115}, "d9": {"name": "Ambassador brief SENT - Ammar Zaky.docx", "sec": "04 Team & Org", "ext": "docx", "blocks": [{"p": "Communiverse Ambassador Brief"}, {"p": "Communiverse  |  29 September 2026  |  Prepared by Haseeb Wasim"}, {"p": "Prepared for Ammar Zaky. The same brief applies to every Communiverse ambassador."}, {"p": "Role at a glance"}, {"p": "An ambassador is the face of Communiverse in their city/country. You travel through it and vlog the journey as you find artisans, onboard them, help them create content, and keep the relationship strong after they join. This brief is also a questionnaire. Please answer the questions at the end so we can support you properly."}, {"t": [["Title", "Communiverse Ambassador"], ["Represents", "Your city/country (confirmed with Keiffer)"], ["Reports to", "Keiffer, Ambassador Programme Lead"], ["Day-to-day coordination", "Elferah Saidal, Head of Operations (onboarding, deadlines, updates)"], ["Works with", "Hassan B Mirza and our in-house video editor (content), Alison Gonzalez for ambassadors in Latin America"], ["Owns", "Travel vlogs and artisan stories, finding and onboarding artisans, helping them create content, and ongoing relationships with the artisans you bring on"]]}, {"p": "Communiverse in brief"}, {"p": "Communiverse connects culture, commerce and community. We sign and verify artisans in writing, then give people four ways to buy from them:"}, {"p": "Learn: workshops and corporate sessions with artisans."}, {"p": "Make: kits, made goods and corporate gifting."}, {"p": "Collect: a marketplace for tangible items: finished pieces, one of one art and commissioned work."}, {"p": "Belong: the Craft Journey (subscription), a longer relationship with craft and the people behind it."}, {"p": "Our first two regions are the UAE and Colombia. Our purpose is to keep crafts alive by giving artisans real income, real customers and a wider audience."}, {"p": "What an ambassador is, and what we offer"}, {"p": "Ambassadors represent their city/country. They travel through it, find and bring in artisans, and tell those artisans' stories: preserving crafts, celebrating local masters, and showing the human side of handmade work."}, {"p": "You travel and vlog. As you move through your city/country looking for artisans, you vlog the journey: the search, the places, the people and the crafts you discover. The vlog is a core part of the job, not an extra."}, {"p": "You onboard artisans and stay with them. You bring artisans in through our official onboarding process, help them create content, and keep in regular contact after they join."}, {"p": "A community, not a list of influencers. You are connected with the artisans you bring on and with other ambassadors, as one network for arts, culture, curation and community."}, {"p": "You film, we edit. You capture raw footage to Communiverse standards; our in-house team edits it in a style that reflects your culture, within the Communiverse brand."}, {"p": "Quality over quantity. We want several verified artisans in each craft, not one gatekeeper per craft, and every one must meet our quality bar."}, {"p": "What Communiverse offers you"}, {"p": "Exposure through Communiverse channels and our wider network."}, {"p": "Expense paid domestic travel when on assignment."}, {"p": "Equipment where needed: a mini action camera if your own camera does not meet our standards."}, {"p": "The chance to do real good for craft communities."}, {"p": "Your compensation is linked to the artisans you bring on, as set out in your ambassador agreement. That is why staying in good contact with them matters."}, {"p": "Your responsibilities"}, {"p": "1. Represent Communiverse"}, {"p": "Be our voice and face in your city/country, online and in person."}, {"p": "Speak about Communiverse accurately, warmly and without craft jargon."}, {"p": "Uphold our standards of conduct with artisans, customers and partners."}, {"p": "2. Travel, vlog and find artisans"}, {"p": "Travel through your city/country to discover skilled artisans and emerging artists across a range of crafts."}, {"p": "Vlog the journey as you go, to Communiverse footage standards."}, {"p": "Understand the quality we look for, and only bring on artisans who meet it."}, {"p": "3. Onboard artisans"}, {"p": "Onboard every artisan through the official Communiverse onboarding process. Keiffer designs it, Haseeb approves it and Elferah manages it."}, {"p": "Support artisans through verification, signing and setting up their profile."}, {"p": "4. Help artisans create content"}, {"p": "Film with each artisan: their hands at work, their space, their pieces and their story."}, {"p": "Direct them on camera so the footage looks natural and meets our standards."}, {"p": "Leave them with Communiverse content guidelines, and show them how to use them, so they can keep creating good content when you are not there."}, {"p": "5. Maintain the relationship"}, {"p": "Stay in regular, respectful contact with every artisan you bring on. Your compensation is linked to them, so good communication is key."}, {"p": "Your communication with artisans is monitored in RAL, our internal operations system."}, {"p": "RAL sends artisans reminders to complete their profiles and update their content. When an artisan needs help, you will be asked to assist."}, {"p": "6. Build the community"}, {"p": "Connect artisans with each other and with other ambassadors."}, {"p": "Attend or host Communiverse sessions and events when asked."}, {"p": "Share local insight: what people want, which crafts are rising, which are at risk."}, {"p": "7. Stay accountable"}, {"p": "Agree monthly goals with Keiffer and share progress with Elferah."}, {"p": "Raise problems early, and ask for support when you need it."}, {"p": "From discovery to an active artisan: the steps"}, {"p": "Discover: find an artisan on your travels whose work meets our quality bar, and capture the moment in your vlog."}, {"p": "Connect: meet them, explain Communiverse simply, and check their interest."}, {"p": "Log: add them to the artisan pipeline so operations can see them."}, {"p": "Onboard: take them through the official onboarding process."}, {"p": "Verify: our team verifies the artisan in person; you support where helpful."}, {"p": "Sign: the artisan signs with Communiverse."}, {"p": "Create: film their story with them, and leave them with our content guidelines."}, {"p": "Stay in touch: keep regular contact, and help when RAL flags that they need support."}, {"p": "Never promise an artisan pay, bookings or exclusivity. Only the Communiverse team can agree terms."}, {"p": "Footage standards and workflow"}, {"p": "Communiverse has set video footage standards, and every vlog and artisan video must meet them. Keiffer shares the full standard with sample videos, style references and shot lists."}, {"p": "Equipment"}, {"p": "If your camera does not meet our standard, Communiverse will provide a mini action camera with the stabilisation needed for smooth, good looking footage."}, {"p": "Skills you need"}, {"p": "Lighting: using natural and available light well, and avoiding harsh shadows and backlight."}, {"p": "Camera: settings, framing, movement and when to use camera effects."}, {"p": "Direction: guiding artisans on camera so they look natural and the story is clear."}, {"p": "Footage basics"}, {"p": "Picture: stable, well lit, in focus, at the resolution and orientation Keiffer specifies."}, {"p": "Sound: clear voice and low background noise; use a microphone for interviews."}, {"p": "Two kinds of content: your travel vlog (the journey and the search) and artisan stories (the artisan, their hands at work, their space, their pieces and why the craft matters to them)."}, {"p": "Consent: get permission before filming, and never film customers or children without consent."}, {"p": "Delivery: raw files uploaded to the shared folder, labelled with the artisan's name, craft, city/country and date."}, {"p": "Posting: do not publish Communiverse content yourself before it has been edited and approved, unless Keiffer agrees."}, {"p": "Workflow: you film, Keiffer reviews the raw footage, Hassan's in-house editor edits it, and Hassan publishes it on Communiverse channels."}, {"p": "How your performance is measured"}, {"p": "Keiffer reviews each ambassador against a simple scorecard every month, with Elferah tracking deadlines. Artisan relationships are tracked in RAL."}, {"t": [["Measure", "What it tells us"], ["Artisans found, onboarded, verified and signed", "How you grow our artisan network"], ["Vlogs and artisan footage delivered on time and to standard", "Reliability and quality"], ["Artisan relationship health: contact, profile completion, content updates (tracked in RAL)", "Whether your artisans stay active"], ["Reach and engagement of your content", "How far your stories travel"], ["Bookings, sales and leads linked to you", "Commercial impact"], ["Artisan feedback on working with you", "Relationship quality"], ["Conduct and brand fit", "Trust in the Communiverse name"]]}, {"p": "Questionnaire: what you need to work at your best"}, {"p": "Answer in the right hand column and return it to Keiffer."}, {"t": [["#", "Question", "Your answer"], ["1", "Which city/country will you represent, and which areas can you travel through?", ""], ["2", "Which crafts and artisans do you already know? Who could you bring on in your first month?", ""], ["3", "Which communities, galleries, venues or institutions are you connected to?", ""], ["4", "Have you vlogged before? Share two or three examples of content you have made.", ""], ["5", "How confident are you with lighting, camera settings and effects, and directing people on camera? Where would you like training?", ""], ["6", "What filming equipment do you have now (camera, phone, microphone, lighting, gimbal)? Will you need a Communiverse action camera?", ""], ["7", "Have you taught others to create content before? How would you help artisans film on their own?", ""], ["8", "How will you keep in touch with the artisans you bring on, and how often?", ""], ["9", "Which social platforms do you use, and roughly how large and engaged is your audience?", ""], ["10", "What languages do you work in?", ""], ["11", "How much time can you give each month, and how often can you travel?", ""], ["12", "How often could you deliver vlogs and artisan stories?", ""], ["13", "What support would help you most from Keiffer, Hassan or the operations team?", ""], ["14", "Is anything in this brief unclear, or is there anything you would add?", ""]]}], "size": 15857}, "d10": {"name": "Ambassador brief SENT - Luna (2026-09-29).docx", "sec": "04 Team & Org", "ext": "docx", "blocks": [{"p": "Communiverse Ambassador Brief"}, {"p": "Communiverse  |  29 September 2026  |  Prepared by Haseeb Wasim"}, {"p": "Prepared for Luna. The same brief applies to every Communiverse ambassador."}, {"p": "Role at a glance"}, {"p": "An ambassador is the face of Communiverse in their city/country. You travel through it and vlog the journey as you find artisans, onboard them, help them create content, and keep the relationship strong after they join. This brief is also a questionnaire. Please answer the questions at the end so we can support you properly."}, {"t": [["Title", "Communiverse Ambassador"], ["Represents", "Your city/country (confirmed with Keiffer)"], ["Reports to", "Keiffer, Ambassador Programme Lead"], ["Day-to-day coordination", "Elferah Saidal, Head of Operations (onboarding, deadlines, updates)"], ["Works with", "Hassan B Mirza and our in-house video editor (content), Alison Gonzalez for ambassadors in Latin America"], ["Owns", "Travel vlogs and artisan stories, finding and onboarding artisans, helping them create content, and ongoing relationships with the artisans you bring on"]]}, {"p": "Communiverse in brief"}, {"p": "Communiverse connects culture, commerce and community. We sign and verify artisans in writing, then give people four ways to buy from them:"}, {"p": "Learn: workshops and corporate sessions with artisans."}, {"p": "Make: kits, made goods and corporate gifting."}, {"p": "Collect: a marketplace for tangible items: finished pieces, one of one art and commissioned work."}, {"p": "Belong: the Craft Journey (subscription), a longer relationship with craft and the people behind it."}, {"p": "Our first two regions are the UAE and Colombia. Our purpose is to keep crafts alive by giving artisans real income, real customers and a wider audience."}, {"p": "What an ambassador is, and what we offer"}, {"p": "Ambassadors represent their city/country. They travel through it, find and bring in artisans, and tell those artisans' stories: preserving crafts, celebrating local masters, and showing the human side of handmade work."}, {"p": "You travel and vlog. As you move through your city/country looking for artisans, you vlog the journey: the search, the places, the people and the crafts you discover. The vlog is a core part of the job, not an extra."}, {"p": "You onboard artisans and stay with them. You bring artisans in through our official onboarding process, help them create content, and keep in regular contact after they join."}, {"p": "A community, not a list of influencers. You are connected with the artisans you bring on and with other ambassadors, as one network for arts, culture, curation and community."}, {"p": "You film, we edit. You capture raw footage to Communiverse standards; our in-house team edits it in a style that reflects your culture, within the Communiverse brand."}, {"p": "Quality over quantity. We want several verified artisans in each craft, not one gatekeeper per craft, and every one must meet our quality bar."}, {"p": "What Communiverse offers you"}, {"p": "Exposure through Communiverse channels and our wider network."}, {"p": "Expense paid domestic travel when on assignment."}, {"p": "Equipment where needed: a mini action camera if your own camera does not meet our standards."}, {"p": "The chance to do real good for craft communities."}, {"p": "Your compensation is linked to the artisans you bring on, as set out in your ambassador agreement. That is why staying in good contact with them matters."}, {"p": "Your responsibilities"}, {"p": "1. Represent Communiverse"}, {"p": "Be our voice and face in your city/country, online and in person."}, {"p": "Speak about Communiverse accurately, warmly and without craft jargon."}, {"p": "Uphold our standards of conduct with artisans, customers and partners."}, {"p": "2. Travel, vlog and find artisans"}, {"p": "Travel through your city/country to discover skilled artisans and emerging artists across a range of crafts."}, {"p": "Vlog the journey as you go, to Communiverse footage standards."}, {"p": "Understand the quality we look for, and only bring on artisans who meet it."}, {"p": "3. Onboard artisans"}, {"p": "Onboard every artisan through the official Communiverse onboarding process. Keiffer designs it, Haseeb approves it and Elferah manages it."}, {"p": "Support artisans through verification, signing and setting up their profile."}, {"p": "4. Help artisans create content"}, {"p": "Film with each artisan: their hands at work, their space, their pieces and their story."}, {"p": "Direct them on camera so the footage looks natural and meets our standards."}, {"p": "Leave them with Communiverse content guidelines, and show them how to use them, so they can keep creating good content when you are not there."}, {"p": "5. Maintain the relationship"}, {"p": "Stay in regular, respectful contact with every artisan you bring on. Your compensation is linked to them, so good communication is key."}, {"p": "Your communication with artisans is monitored in RAL, our internal operations system."}, {"p": "RAL sends artisans reminders to complete their profiles and update their content. When an artisan needs help, you will be asked to assist."}, {"p": "6. Build the community"}, {"p": "Connect artisans with each other and with other ambassadors."}, {"p": "Attend or host Communiverse sessions and events when asked."}, {"p": "Share local insight: what people want, which crafts are rising, which are at risk."}, {"p": "7. Stay accountable"}, {"p": "Agree monthly goals with Keiffer and share progress with Elferah."}, {"p": "Raise problems early, and ask for support when you need it."}, {"p": "From discovery to an active artisan: the steps"}, {"p": "Discover: find an artisan on your travels whose work meets our quality bar, and capture the moment in your vlog."}, {"p": "Connect: meet them, explain Communiverse simply, and check their interest."}, {"p": "Log: add them to the artisan pipeline so operations can see them."}, {"p": "Onboard: take them through the official onboarding process."}, {"p": "Verify: our team verifies the artisan in person; you support where helpful."}, {"p": "Sign: the artisan signs with Communiverse."}, {"p": "Create: film their story with them, and leave them with our content guidelines."}, {"p": "Stay in touch: keep regular contact, and help when RAL flags that they need support."}, {"p": "Never promise an artisan pay, bookings or exclusivity. Only the Communiverse team can agree terms."}, {"p": "Footage standards and workflow"}, {"p": "Communiverse has set video footage standards, and every vlog and artisan video must meet them. Keiffer shares the full standard with sample videos, style references and shot lists."}, {"p": "Equipment"}, {"p": "If your camera does not meet our standard, Communiverse will provide a mini action camera with the stabilisation needed for smooth, good looking footage."}, {"p": "Skills you need"}, {"p": "Lighting: using natural and available light well, and avoiding harsh shadows and backlight."}, {"p": "Camera: settings, framing, movement and when to use camera effects."}, {"p": "Direction: guiding artisans on camera so they look natural and the story is clear."}, {"p": "Footage basics"}, {"p": "Picture: stable, well lit, in focus, at the resolution and orientation Keiffer specifies."}, {"p": "Sound: clear voice and low background noise; use a microphone for interviews."}, {"p": "Two kinds of content: your travel vlog (the journey and the search) and artisan stories (the artisan, their hands at work, their space, their pieces and why the craft matters to them)."}, {"p": "Consent: get permission before filming, and never film customers or children without consent."}, {"p": "Delivery: raw files uploaded to the shared folder, labelled with the artisan's name, craft, city/country and date."}, {"p": "Posting: do not publish Communiverse content yourself before it has been edited and approved, unless Keiffer agrees."}, {"p": "Workflow: you film, Keiffer reviews the raw footage, Hassan's in-house editor edits it, and Hassan publishes it on Communiverse channels."}, {"p": "How your performance is measured"}, {"p": effects and directing people on camera, especially for short-form. Open to improving technical skills, particularly professional lighting and more advanced camera techniques."], ["6", "What filming equipment do you have now (camera, phone, microphone, lighting, gimbal)? Will you need a Communiverse action camera?", "iPhone 17 Pro Max, wireless microphone and basic lighting. Comfortable creating high-quality mobile content; happy to use a Communiverse action camera for specific shoots."], ["7", "Have you taught others to create content before? How would you help artisans film on their own?", "Has helped others create and improve social media content. Would keep it simple for artisans: easy filming setups, camera angles, lighting, and capturing their process naturally so they can create independently."], ["8", "How will you keep in touch with the artisans you bring on, and how often?", "Regular contact through WhatsApp and Instagram, with follow-ups based on content needs. Aim for at least weekly communication with active artisans."], ["9", "Which social platforms do you use, and roughly how large and engaged is your audience?", "Main platform Instagram with 33k+ followers, strong engagement and regular reach. Also TikTok and YouTube for short-form with growing audiences."], ["10", "What languages do you work in?", "Arabic (native), English (fluent) \u2014 confirmed."], ["11", "How much time can you give each month, and how often can you travel?", "About 2\u20133 days per week, with flexibility depending on filming schedules. Based in UAE; can travel across the country for planned shoots and events."], ["12", "How often could you deliver vlogs and artisan stories?", "Around 2\u20133 vlogs or stories per week depending on filming schedule and locations; flexible to adjust to project needs."], ["13", "What support would help you most from Keiffer, Hassan or the operations team?", "Clear content guidelines, coordination with artisans, access to necessary equipment, and regular team feedback to stay aligned with project goals."], ["14", "Is anything in this brief unclear, or is there anything you would add?", "Brief is clear overall. Wants clear expectations on content deliverables, timelines and workflow from the start. Open to discussing additional ideas to make artisan stories more engaging."]]}, {"p": "Completed on 5 Oct 2026. Answers filled below."}], "size": 9033}, "d12": {"name": "Ambassador questionnaire RECEIVED - Ammar Zaky - completed 2026-10-05 (My Drive version, last edited 2026-10-11).docx", "sec": "04 Team & Org", "ext": "docx", "blocks": [{"p": "Communiverse Ambassador Questionnaire"}, {"p": "Prepared for Ammar Zaky. Please answer in the right-hand column and return it to Keiffer."}, {"t": [["#", "Question", "Your answer"], ["1", "Which city/country will you represent, and which areas can you travel through?", "Based in the UAE; can represent Dubai and Abu Dhabi, with flexibility to travel across the UAE when needed."], ["2", "Which crafts and artisans do you already know? Who could you bring on in your first month?", "Connections with local creatives and small businesses across Dubai and the UAE, especially lifestyle, food, fitness and handmade products. Can reach out to relevant artisans and bring in a few strong profiles in the first month."], ["3", "Which communities, galleries, venues or institutions are you connected to?", "Connected with local creative and community groups in Dubai and the UAE, plus venues and small businesses through content and events work. Can leverage existing network to build new community and institution connections."], ["4", "Have you vlogged before? Share two or three examples of content you have made.", "Creates vlog-style and short-form content covering experiences, events, activities and local business. Examples: event coverage, food/lifestyle experiences, skating community content. Can share 2\u20133 Instagram examples on request."], ["5", "How confident are you with lighting, came les for international videos."}, {"p": "11. Time and travel: depends on the budget."}, {"p": "12. Delivery frequency: depends on the number and length of videos needed; happy to agree together."}, {"p": "13. Support needed: financial support to cover travel and the time he spends on the project."}, {"p": "14. Open questions: he'd like to know the rough budget, how long it would run, and when it starts."}], "size": 8029}, "d14": {"name": "Ambassador questionnaire RECEIVED - Luna - completed 2026-09-30.docx", "sec": "04 Team & Org", "ext": "docx", "blocks": [{"p": "Communiverse Ambassador Questionnaire: Luna"}, {"p": "Completed answers, 30 September 2026. Returned to Keiffer, Ambassador Programme Lead."}, {"t": [["#", "Question", "Answer"], ["1", "Which city/country will you represent, and which areas can you travel through?", "Open to worldwide destinations."], ["2", "Which crafts and artisans do you already know? Who could you bring on in your first month?", "UAE-based women artisans from Ajman. A wood carving artisan from Bhutan."], ["3", "Which communities, galleries, venues or institutions are you connected to?", "A skating community and a slackline/circus group."], ["4", "Have you vlogged before? Share two or three examples of content you have made.", "Yes, not regularly but passionate about it. (No examples shared yet.)"], ["5", "How confident are you with lighting, camera settings and effects, and directing people on camera? Where would you like training?", "Still in the learning process. Wants training with Keiffer."], ["6", "What filming equipment do you have now (camera, phone, microphone, lighting, gimbal)? Will you need a Communiverse action camera?", "Camera, Meta glasses and an iPhone. Will need a tripod and an action camera."], ["7", "Have you taught others to create content before? How would you help artisans film on their own?", "First needs to learn from Keiffer and take training sessions on video recording and storytelling."], ["8", "How will you keep in touch with the artisans you bring on, and how often?", "Through Zoom calls, WhatsApp and personal visits for artisans locally based in the UAE. (Frequency not stated.)"], ["9", "Which social platforms do you use, and roughly how large and engaged is your audience?", "Instagram, Facebook and LinkedIn. Total engagement of 100k views, with 6,000+ followers on Instagram."], ["10", "What languages do you work in?", "Mainly Spanish, with AI translations to English. Speaks Spanish, English and Portuguese."], ["11", "How much time can you give each month, and how often can you travel?", "8-10 hours per month while holding a main job in Dubai; more time available otherwise. Open to travelling full time once leaving Dubai; otherwise a minimum of 2-3 times per year."], ["12", "How often could you deliver vlogs and artisan stories?", "After a full month of travelling, up to four or five vlogs that month. When not travelling and reaching out to artisans long distance, twice per month."], ["13", "What support would help you most from Keiffer, Hassan or the operations team?", "Right now, training in video recording, plus tips and advice on video recording and storytelling (videography) so everyone aligns on the vision and how the videos should look."], ["14", "Is anything in this brief unclear, or is there anything you would add?", "Believes questions will come up along the way once they start working together."]]}], "size": 8734}, "d15": {"name": "Ambassador questionnaire SENT - Ammar Zaky - 2026-10-05 11-57 (blank, Q10 pre-filled).docx", "sec": "04 Team & Org", "ext": "docx", "blocks": [{"p": "Communiverse Ambassador Questionnaire"}, {"p": "Prepared for Ammar Zaky. Please answer in the right-hand column and return it to Keiffer."}, {"t": [["#", "Question", "Your answer"], ["1", "Which city/country will you represent, and which areas can you travel through?", ""], ["2", "Which crafts and artisans do you already know? Who could you bring on in your first month?", ""], ["3", ou have made.", ""], ["5", "How confident are you with lighting, camera settings and effects, and directing people on camera? Where would you like training?", ""], ["6", "What filming equipment do you have now (camera, phone, microphone, lighting, gimbal)? Will you need a Communiverse action camera?", "Has a camera (model TBC). Confirm phone / mic / lighting / gimbal. Communiverse action camera: TBC after you answer."], ["7", "Have you taught others to create content before? How would you help artisans film on their own?", ""], ["8", "How will you keep in touch with the artisans you bring on, and how often?", ""], ["9", "Which social platforms do you use, and roughly how large and engaged is your audience?", ""], ["10", "What languages do you work in?", "Arabic (native), English (fluent)"], ["11", "How much time can you give each month, and how often can you travel?", ""], ["12", "How often could you deliver vlogs and artisan stories?", ""], ["13", "What support would help you most from Keiffer, Hassan or the operations team?", ""], ["14", "Is anything in this brief unclear, or is there anything you would add?", ""]]}, {"p": "Note: Q10 is pre-filled from your CV. Change it if needed. Leave the other answers blank until you fill them in."}], "size": 8133}, "d17": {"name": "Ambassador questionnaire SENT - Luna (2026-09-29, blank).docx", "sec": "04 Team & Org", "ext": "docx", "blocks": [{"p": "Communiverse Ambassador Questionnaire"}, {"p": "Prepared for Luna. Please answer in the right-hand column and return it to Keiffer."}, {"t": [["#", "Question", "Your answer"], ["1", "Which city/country will you represent, and which areas can you travel through?", ""], ["2", "Which crafts and artisans do you already know? Who could you bring on in your first month?", ""], ["3", "Which communities, galleries, venues or institutions are you connected to?", ""], ["4", "Have you vlogged before? Share two or three examples of content you have made.", ""], ["5", "How confident are you with lighting, camera settings and effects, and directing people on camera? Where would you like training?", ""], ["6", "What filming equipment do you have now (camera, phone, microphone, lighting, gimbal)? Will you need a Communiverse action camera?", ""], ["7", "Have you taught others to create content before? How would you help artisans film on their own?", ""], ["8", "How will you keep in touch with the artisans you bring on, and how often?", ""], ["9", "Which social platforms do you use, and roughly how large and engaged is your audience?", ""], ["10", "What languages do you work in?", ""], ["11", "How much time can you give each month, and how often can you travel?", ""], ["12", "How often could you deliver vlogs and artisan stories?", ""], ["13", "What support would help you most from Keiffer, Hassan or the operations team?", ""], ["14", "Is anything in this brief unclear, or is there anything you would add?", ""]]}], "size": 8089}, "d18": {"name": "Competitor Feature Rollouts - research source (2026-10-14).docx", "sec": "06 Market & Commercial", "ext": "docx", "blocks": [{"p": "Competitor Feature Rollouts: Communiverse Data Room (Competitive Landscape)"}, {"p": "Research date: 14 Oct 2026. Public sources only; every figure is cited. \"n/d\" = not disclosed."}, {"p": "1. Artsy (NYC, founded 2009; online art marketplace for galleries, auctions and fairs)"}, {"t": [["Date", "Rollout / change", "Source"], ["Oct 9, 2012", "Public launch. Discovery plus editorial, with inquiry-led sales: buyers contacted galleries directly and Artsy did not transact", "artsy-timeline.netlify.app; uschamber.com"], ["Oct 2013", "First benefit auction (ICI)", "artsy-timeline.netlify.app"], ["Mar 2014", "Art-fair tech debuts at The Armory Show; became its digital partner in 2015", "artsy-timeline.netlify.app"], ["2015", "Pivot into commercial auctions: LAMA first, then a Sotheby's online-only sale (announced Sep 8, 2015)", "files.artsy.net/sothebys-artsy/press-release"], ["Jun 2016", "Live Auction Integration: remote real-time bidding in Christie's, Sotheby's, Phillips and Heritage salerooms", "artsy.github.io (Aug 9, 2016); pymnts.com"], ["Jul 18, 2017", "$50M Series D at a $275M valuation, aimed at \"doubling down\" on auctions", "techcrunch.com (Jul 18, 2017)"], ["2019\u20132020", "New CEO Mike Steib. Mobile-first reorg; new app home page, profiles and push settings", "artsy.github.io (Sep 29, 2020)"], ["2020", "Buy Now / Make Offer (15% commission). Gallery subscription raised (e.g. $375 to $650/mo), with plans running $200 to $3,000+/mo", "theartnewspaper.com (Mar 23, 2020)"], ["2021", "Android app (React Native), \"affinity score\" recommendation model, shipping/tax integrations (Arta, Avalara)", "artsy.github.io (Jan 6, 2022)"], ["Ongoing", "Free Price Database (auction records for 300k artists) used as a top-of-funnel tool", "artsy.net/price-database"]]}, {"p": "Success metrics reported: first auction had 100% sell-through, and 85% of winning bids came from Artsy collectors (2015). 41 auctions in 2016, on track to quadruple in 2017. ~$20M in sales facilitated per month (2017). Artsy accounted for 1/3 of bids and 9% of sales in the auctions it hosted. Later figures: ~4,000 paying partners, 1.7M registered users, 2.3M monthly uniques, 1M+ app downloads. Financials n/d. Signal: Artsy went from discovery/content to transactions and then to mobile. Monetisation moved from subscriptions to commission on direct checkout. The 2020 price hikes upset small galleries, which shows the risk of charging the supply side heavily."}, {"p": "2. Etsy (NYC; creative-goods marketplace, public company)"}, {"t": [["Date", "Rollout / change", "Source"], ["Jul 16, 2018", "Seller transaction fee raised from 3.5% to 5%, now also applied to shipping", "sec.gov R10 (FY2020 10-K)"], ["2019", "Reverb acquired. Unified \"Etsy Ads\" in Q3 2019", "sec.gov FY2020/FY2021 10-K"], ["May 4, 2020", "Offsite Ads: Etsy pays for the ads and sellers pay 12\u201315% only when an ad leads to a sale", "sec.gov FY2020 10-K"], ["2020", "Etsy Payments expanded to 45 countries; 92% of GMS ran through it", "sec.gov FY2020 10-K"], ["Jul 2021", "Acquired Depop and Elo7 (\"House of Brands\")", "sec.gov FY2021 10-K"], ["Q3 2021", "Star Seller program defines and rewards seller quality standards", "sec.gov FY2021 10-K"], ["2024", "Gift Mode (~5,000 gift ideas) and Etsy Insider, a paid buyer membership (US beta)", "investors.etsy.com Q3 2024; help.etsy.com"]]}, {"p": "Success metrics reported: FY2020: $10.3B GMS, 81.9M active buyers (+76.7%), 4.4M sellers, Q4 take rate 17.1% (+80bps). Offsite Ads opt-out was under 2%, and 9% of H2 GMS was subject to the fee. Habitual buyers +157% and repeat buyers +97% (Q4 2020). FY2021: 96.3M buyers and 7.5M sellers across all marketplaces; Offsite Ads revenue offset ~33% of performance marketing spend. FY2024: $12.587B GMS (\u22124.4%), 95.5M buyers, take rate 22.3%. FY2025: $11.917B GMS (\u22125.3%), 93.5M buyers, take rate 24.2%, with the app at 45% of GMS. (investors.etsy.com 8-Ks; 10-Ks) Signal: Etsy grew revenue mainly by raising take rate (fees, ads, payments) while GMS shrank after 2021. Retention is measured with buyer cohorts (habitual and repeat buyers). Quality is enforced through seller badges, and the paid buyer membership is a loyalty play."}, {"p": "3. Saatchi Art (Los Angeles; curated marketplace for emerging artists, owned by Leaf Group)"}, {"p": "2010: commercial launch. Early 2011: online sales for artists begin. Jan 2014: renamed from Saatchi Online to Saatchi Art (crunchbase.com/organization/saatchiart)."}, {"p": "Current model: artists apply with a 3-work portfolio and verify their identity. Curators review uploads daily. Art Advisors sell to collectors in 140+ countries, and a trade team sources work for commercial clients. \"Rising Stars\" and digital exhibitions provide editorial. Commission is 40% on originals vs ~50% at most galleries (saatchiart.com/whysell)."}, {"p": "Metrics: n/d publicly."}, {"p": "Signal: this is the closest analogue to Plug's \"verified emerging artists\". Its edge comes from curation plus a human advisory layer, not from the software."}, {"p": "4. Singulart (Paris, 2017; online gallery for established and emerging artists)"}, {"p": "2017: launch. 2018: 1,500 artists across 80 countries. 2020: 10,000 artists, 100 staff, \u20ac10M Series A (Ventech). Nov 19, 2021: \u20ac60M Series B (Vitruvian) and launch of balthasart for up-and-coming artists and first-time collectors. Later: physical galleries in Stuttgart and Berlin, a Trade offering with 5* hotels and interior designers, iconic-artist works (Picasso, Dal\u00ed), and a service matching artists with gallerists (singulart.com/en/about; singulart.com/blog 2021/11/19)."}, {"p": "Metrics: 20,000+ collectors (2021). Today 9,000 artists from 165 countries and 110K artworks sold."}, {"p": "Signal: it expanded into B2B trade and hospitality, went phygital with physical galleries, and split off a sub-brand for entry-level buyers."}, {"p": "5. Artfinder (UK; independent-artist marketplace, B Corp)"}, {"p": "Crowdcube round: \u00a3834,056 from 1,320 investors, many of them artists and customers. Wellington Partners had invested \u00a35m to date. Funds go to faster artist payouts, better buyer and seller UX, and customer acquisition (artfinder.com/blog/post/artfinder-crowdfunding)."}, {"p": "Signal: community ownership and B Corp status act as a moat, and it competes on artist-payout speed."}, {"p": "6. Masterworks (NYC; fractional investment in blue-chip art)"}, {"p": "Shares of single-artwork Series LLCs sell at $20 under SEC Reg A, with a secondary trading market. Fees are 1.5%/yr plus 20% of profit. Oct 5, 2021: $110M Series A at a $1B+ valuation (Left Lane); the company was bootstrapped and profitable before that (techcrunch.com 2021/10/05; globenewswire). Membership is now members-only, by sponsorship (masterworks.com)."}, {"p": "Metrics: 940k+ members, 419 works and ~$1B AUM (Jun 2024, benzinga). 530+ works acquired, 32 sold and $77M+ distributed (masterworks.com)."}, {"p": "Signal: art as an asset class. Exclusive, invite-only membership drives demand, which is relevant to Communiverse's \"club\" and ambassador model."}, {"p": "7. MENA / Dubai players"}, {"p": "Art Dubai Digital (2022): the fair's first digital-art section, with Bybit as lead partner and 17 presentations; it has since moved toward AI, immersive and phygital work (alarabiya.net 2022/03/17; artdubai.ae blog 2024)."}, {"p": "Art Smiley (Dubai-founded): 3,500+ artists, selling physical and digital art plus NFTs (gulf-times.com)."}, {"p": "POPC (Dubai): online marketplace for local and global artists (thenationalnews.com 2023/05/15)."}, {"p": "Signal: the local market is fragmented and listing-led. No regional player combines verified artists, community circles and bookable artist sessions."}, {"p": "Signals for Communiverse: potential pivots and feature priorities"}, {"p": "Start with discovery and community, then move to transactions. Artsy started as discovery/inquiry and only later added checkout and auctions. Launch Plug with direct checkout from day one, but measure the community layer (circles, ambassadors) as the acquisition engine."}, {"p": "Keep supply-side fees low and earn from success-based fees and buyer services. Artsy's subscription hikes drew backlash. Etsy's success-based Offsite Ads had under 2% opt-out. Use commission plus success-based promotion rather than artist subscriptions."}, {"p": "Make verification a visible product. Saatchi curation and Etsy's Star Seller show this works. \"Verified\" Plug badges with clear standards are a defensibility point."}, {"p": "Add a human advisory / trade layer. Saatchi's advisors and Singulart's Trade arm show it. In Dubai, hotels, developers and interior designers are a natural B2B channel to pilot by mid-2027."}, {"p": "Treat artist sessions and experiences as the differentiator. No competitor reviewed sells bookable time with artists. Track sessions booked, rebook rate and session-to-artwork conversion."}, {"p": "Use a club and membership structure. Masterworks (sponsor-only) and Etsy Insider (paid membership) show it can work. An ambassador-referral, tiered membership fits Communiverse."}, {"p": "Report investor-grade KPIs from launch, the way Etsy does: GMV, active buyers, repeat and habitual buyers, take rate, active verified artists, sell-through and app share of GMV."}, {"p": "Watch-outs: auctions and fractional investing are capital- and regulation-heavy (Masterworks' SEC Reg A route), so keep them out of the 12\u201318 month roadmap. Phygital pop-ups (Singulart galleries, Art Dubai Digital) are a cheaper lever."}], "size": 14664}, "d19": {"name": "Competitor Landscape - merged (deck s11 + research).docx", "sec": "06 Market & Commercial", "ext": "docx", "blocks": [{"p": "Communiverse: Merged Competitor Landscape"}, {"p": "Version 1 \u00b7 15 Oct 2026 \u00b7 Owner: Keiffer Japeth. Merges deck slide 11 (2 Oct) with the Competitor Feature Rollouts research (14 Oct, in this folder) and reconciles where they conflict. \"n/s\" = not in our sources (no claim made). Figures: Key Figures."}, {"p": "Matrix"}, {"t": [["Category", "Player", "Source set", "What they sell", "Verifies the maker?", "Sells bookable artist time?", "Ongoing artisan relationship / multi-line?", "Sourced facts"], ["Handmade marketplace", "Etsy", "Deck + research", "Listings, checkout, ads", "Partial: Star Seller quality badge (2021). Allows third-party-printed designs and seller-prompted AI art (deck s2)", "No", "No", "FY2025 GMS US$11.917bn, 93.5m buyers, 24.2% take rate [KF-47]"], ["Handmade marketplace", "Novica", "Deck", "Artisan goods listings", "n/s", "n/s", "n/s", "\u2014"], ["Handmade marketplace", "Amazon Handmade", "Deck", "Listings", "n/s", "n/s", "n/s", "\u2014"], ["Curated art marketplace", "Saatchi Art", "Research only (add to deck)", "Original art from emerging artists", "Yes: 3-work portfolio, ID check, daily curation", "No", "Partial: Art Advisors, trade team", "40% commission on originals"], ["Online gallery", "Singulart", "Research only (add to deck)", "Established and emerging art; B2B trade with hotels and designers", "Curated", "No", "Partial: gallerist matching, Trade arm", "9,000 artists, 165 countries, 110k artworks sold; \u20ac60m Series B (2021)"], ["Independent-artist marketplace", "Artfinder", "Research only", "Art from independent artists", "n/s", "No", "No", "\u00a3834k crowdfund from 1,320 investors"], ["Art marketplace / auctions", "Artsy", "Research only", "Gallery, auction and fair sales", "Gallery-vetted", "No", "No", "~US$20m sales facilitated a month (2017)"], ["Fractional art", "Masterworks", "Research only", "Shares in blue-chip works", "n/a", "No", "No", "940k+ members, ~US$1bn AUM (Jun 2024)"], ["Experience platforms", "Airbnb Experiences, Fever, Eventbrite, ClassPass", "Deck", "Bookable activities and audiences", "n/s (deck says \"no verification\")", "Yes: hosts and instructors, including craft sessions", "No: \"One booking, then goodbye\" (deck s11)", "\u2014"], ["Social", "Instagram, TikTok, YouTube", "Deck", "Reach and storytelling", "No", "No", "No", "\u2014"], ["Event / team-building firms", "Workshop studios, agencies", "Deck", "One-off corporate days", "n/s", "Yes, via agency", "Agency keeps the client", "Dubai public prices AED 210\u2013450 per person [KF-56]"], ["MENA", "Art Dubai Digital", "Research only", "Fair section for digital art (2022)", "Fair-curated", "No", "No", "17 presentations (2022)"], ["MENA", "Art Smiley (Dubai)", "Research only (add to deck)", "Physical and digital art, NFTs", "n/s", "No", "No", "3,500+ artists"], ["MENA", "POPC (Dubai)", "Research only", "Online art marketplace", "n/s", "No", "No", "\u2014"], ["Communiverse", "\u2014", "\u2014", "Workshops, corporate programmes, commissions, kits, marketplace (s9)", "Planned (protocol GAP)", "Planned: booking flow live, 0 confirmed slots [KF-21]", "Planned: five lines per artisan", "Pre-launch; 0 signed artisans [KF-20]"]]}, {"p": "Reconciled conflicts"}, {"t": [["ID", "Conflict", "Resolution used in this data room"], ["C-1", "Research: \"No competitor reviewed sells bookable time with artists\" vs deck s11, which lists experience platforms that do", "\"None of the art marketplaces reviewed sells bookable artist time. Experience platforms do, but without verifying the maker or keeping a continuing relationship.\""], ["C-2", "Two different competitor sets", "Merged above. Proposal for deck v2 s11: add Saatchi Art (closest analogue), Singulart and Art Smiley"], ["C-3", "Research: \"launch Plug with direct checkout from day one\" vs deck: marketplace sales Late 2027 (s9) / GCC beta Q1 2028 (s15)", "The deck roadmap governs. At launch, bookings are paid per session (s6: \"Paid on the day they teach\"), and marketplace checkout comes later. The date conflict between s9 and s15 is still open [KF-43]"], ["M-1", "Deck: \"No platform holds more than 0.5%\" vs Etsy at 1.2% of IMARC's estimate (calc)", "Reworded as \"highly fragmented; the largest handmade marketplace's GMS is about 1% of the global estimate\" [KF-46]"], ["C-4", "The research cites domains, not URLs", "Open: full URLs and access dates still to add (Keiffer)"]]}, {"p": "Pre-seed framing (added 15 Oct 2026, 3:15 PM Dubai)"}, {"p": "Purpose: show reviewers we understand substitutes and the closest analogues (IDI 6 Market & Commercial; ADI External Pressure), not to claim we beat them. The Communiverse row describes what we are building; today it is pre-launch with 0 signed artisans and 0 confirmed slots [KF-20, KF-21]. Competitor figures are public, third-party facts with sources in the research file; they are UNVERIFIED by us beyond those sources, and C-4 (full URLs and access dates) is still open. Saatchi Art (40%), Singulart, Artfinder, Masterworks, Art Dubai Digital and Art Smiley figures have no KF ID yet; their source is the Competitor Feature Rollouts file (06)."}], "size": 12383}, "d20": {"name": "Market Sizing - TAM SAM SOM (Dubai, UAE, GCC).docx", "sec": "06 Market & Commercial", "ext": "docx", "blocks": [{"p": "Communiverse: Market Sizing (TAM / SAM / SOM)"}, {"p": "Version 1 \u00b7 15 Oct 2026 \u00b7 Owner: Keiffer Japeth (Head of GTM and Ambassador Programme). Every figure carries a Key Figures ID ([KF-xx]) that links to its source in the Key Figures sheet. ASSUMPTION = not sourced, shown only to make the arithmetic auditable. GAP = input Haseeb needs to set from the financial model. \"calc\" = arithmetic on cited figures."}, {"p": "Summary"}, {"p": "Global markets are context, not TAM. The deck's three totals are separate markets and shouldn't be added together."}, {"p": "SAM is built bottom-up from Dubai. Dubai alone has about 12.36m culturally engaged international visitors a year (calc) and 4.58m residents [KF-50, KF-51, KF-52]. One craft session costs about US$57\u201360 at public Dubai prices [KF-56]."}, {"p": "SOM has no sourced inputs yet. It's a visible formula, and every input is a GAP until the financial model exists. We show one illustrative capacity check, labelled as such."}, {"p": "1. Context markets (top-down, not summed)"}, {"t": [["Market", "Size", "Source", "Use"], ["Global handicrafts, 2025", "US$986.9bn", "IMARC [KF-45] (verified 15 Oct)", "Context only. Grand View's lower estimate is US$740bn (deck s17)"], ["Travel experiences, 2025", "US$271bn; 33% booked online", "Arival & Phocuswright [KF-48] (deck citation, URL pending)", "Context for workshops and experiences"], ["Global art market, 2025", "US$59.6bn", "Art Basel & UBS [KF-49] (deck citation, URL pending)", "Context for 1-of-1s and commissions"]]}, {"p": "Correction to the deck (s2, s4). The deck says \"No platform holds more than 0.5%\". Etsy's FY2025 GMS of US$11.917bn is 1.2% (calc) of IMARC's US$986.9bn [KF-46, KF-47]. Etsy's GMS isn't all handicraft, but the claim as written doesn't hold. Proposed wording: \"Highly fragmented: the largest handmade marketplace's GMS equals about 1% of the global handicrafts estimate.\""}, {"p": "2. SAM, step 1: Dubai (launch hub, Q1 2027 [KF-44])"}, {"t": [["Segment", "Base", "Source", "Serviceable filter", "Serviceable units"], ["International visitors, 2024", "18.72m", "DET [KF-50]", "\u00d7 66% who visited cultural or heritage sites [KF-51]", "12.36m visitors (calc)"], ["Residents, end-2025", "4.580m", "Dubai Data & Statistics Establishment [KF-52]", "Adults who would book a paid craft session: GAP", "GAP"], ["Corporate teams", "GAP", "No sourced count of Dubai companies yet", "Team-building and gifting buyers: GAP", "GAP"]]}, {"p": "Price anchor. Public Dubai pottery classes cost AED 210\u2013220 per person for 1.5 hours (\u2248 US$57.18\u201359.90, calc at 3.6725 [KF-62]). Two-hour classes cost AED 330\u2013450, and team-building sessions AED 425 per person [KF-56]. Communiverse's own price and take rate are GAP [KF-61]."}, {"p": "Dubai visitor SAM sensitivity. The booking rates below are ASSUMPTIONS, not data:"}, {"t": [["Share of culturally engaged visitors booking one session a year (ASSUMPTION)", "Seats", "Spend at US$57.18 (calc)"], ["1%", "123,600", "US$7.07m"], ["2%", "247,200", "US$14.14m"], ["5%", "618,000", "US$35.34m"]]}, {"p": "Dubai resident SAM sensitivity (ASSUMPTION: one session a year): 2% of 4.58m = 91,600 seats \u2248 US$5.24m; 5% = 229,000 seats \u2248 US$13.09m (calc)."}, {"p": "These are spend pools for workshops only. Corporate programmes, commissions, kits and marketplace sales [deck s9] stay unsized until there's sourced data (GAP)."}, {"p": "3. SAM, step 2: UAE, then GCC (2028 per roadmap [KF-43, KF-44])"}, {"t": [["Layer", "Base", "Source", "Note"], ["UAE residents, 2024", "11.29m", "FCSC via Gulf News [KF-53]", "Abu Dhabi and Sharjah supply and demand not yet scoped (GAP)"], ["GCC international arrivals, 2024", "72.2m; tourism revenue US$120.2bn", "GCC-Stat [KF-54]", "GCC-wide cultural-visit share isn't published in our sources. Using Dubai's 66% is an ASSUMPTION: 72.2m \u00d7 66% \u00d7 1% \u00d7 US$57.18 \u2248 US$27.2m (calc, illustrative)"], ["GCC population, 2024", "61.5m", "GCC-Stat [KF-55]", "Resident participation: GAP"], ["Saudi Arabia", "Year of Handicrafts 2025", "Saudi Ministry of Culture (deck s4)", "Policy signal, not a market size"]]}, {"p": "4. Supply corridor: Colombia \u2192 US"}, {"p": "About 350,000 Colombian artisans, 15% of manufacturing jobs [KF-57]. US$19 per artisan, calc), with the US the #1 buyer [KF-58]. 82% of craft-income households earn below minimum wage [KF-59]."}, {"p": "US buyer demand for Colombian craft is GAP: it needs a sourced US import or consumer figure. Until then this is a supply-side thesis, not a sized market."}, {"p": "5. SOM: 24-month bottom-up formula (inputs from the model)"}, {"p": "Workshop GMV / month = signed artisans \u00d7 sessions per artisan per month \u00d7 seats per session \u00d7 average price per seat Revenue = GMV \u00d7 take rate + corporate programmes \u00d7 margin + (commissions, kits, marketplace from 2027)"}, {"t": [["Input", "Value", "Status"], ["Signed artisans by month (UAE, Colombia)", "0 today [KF-20]", "GAP: Haseeb to set the ramp"], ["Sessions per artisan per month", "\u2014", "GAP"], ["Seats per session", "\u2014", "GAP"], ["Average price per seat", "US$57\u201360 public benchmark [KF-56]", "Benchmark, not Communiverse pricing"], ["Take rate", "\u2014", "GAP (the demo's 12% is illustrative [KF-61])"], ["Corporate programmes and margin", "0 contracts [KF-23]", "GAP"]]}, {"p": "Illustrative capacity check (NOT A FORECAST): 20 artisans \u00d7 4 sessions \u00d7 8 seats \u00d7 US$57.18 = US439k a year (calc). This only shows the order of magnitude. Replace it with the model."}, {"p": "6. What would raise confidence"}, {"p": "A financial model with the SOM inputs above (Haseeb)."}, {"p": "Survey raw data with one n [KF-16]."}, {"p": "Page references for the DET 66% figure and URLs for the Arival, Art Basel/UBS, ProColombia and DANE figures."}, {"p": "A sourced count of Dubai companies and HR/team-building spend."}, {"p": "Pre-seed framing (added 15 Oct 2026, 3:15 PM Dubai)"}, {"p": "This sizing supports an investment-readiness assessment, not a sales case. What we have evidenced: sourced context markets and a bottom-up Dubai visitor and resident base with a public price anchor [KF-45 to KF-56]. What we are building: the SOM, which stays a formula until the financial model sets signed-artisan, session, seat and take-rate inputs [KF-20, KF-61]. The sensitivity tables are ASSUMPTIONS, not forecasts or promised outcomes. Figures cite the v1 Key Figures sheet link above; IDs are unchanged in Key Figures CURRENT (1g6tSJ8c\u2026), which governs. Fixed in this update: two lines where currency text had been lost in formatting (GCC illustration restored as 72.2m \u00d7 66% \u00d7 1% \u00d7 US$57.18 \u2248 US$27.2m; Colombia export total flagged for restoration from KF-58)."}], "size": 14198}, "d21": {"name": "Ambassador Travel Package Model (estimates, 2026-10-01).xlsx", "sec": "07 Financials & Capital", "ext": "xlsx", "blocks": [{"h": "Sheet: Comparison"}, {"t": [["Combined comparison - all four regions (UAE, Colombia, India, Egypt)", "", "", "", "", "", "", "", "", "", ""], ["Per ambassador, per trip, USD. Selected season for breakdown/incentive blocks: Shoulder. Incentive USD 150 per signed artisan. UAE & Colombia launch first; India & Egypt are future regions. Prices are estimates from public sources (see Sources).", "", "", "", "", "", "", "", "", "", ""], ["A. Travel package total by season (includes 10% contingency and equipment kit; excludes fee & incentive)", "", "", "", "", "", "", "", "", "", ""], ["Package", "Description", "Region", "Type", "7-day Low", "7-day Shoulder", "7-day High", "14-day Low", "14-day Shoulder", "14-day High", "7-day Shoulder (AED)"], ["UAE-D", "UAE domestic: Dubai / Abu Dhabi / Sharjah / Ajman (ground only, Dubai-based ambassador)", "UAE", "Domestic", "1,
